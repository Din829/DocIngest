# DocIngest Default Configuration
# Override per-project by placing a docingest.yaml in your project root
# Priority: default.yaml < project docingest.yaml < CLI args

# =============================================================================
# AI Models (multi-provider with fallback)
# =============================================================================
models:
  # Fallback defaults for every LLM task (vision / chunking_assist / refine / ...).
  # Any task that does not explicitly set max_response_tokens inherits this.
  # Set explicitly because litellm injects max_tokens=4096 by default for both
  # Gemini and Claude when omitted (https://github.com/BerriAI/litellm/issues/8835).
  defaults:
    # ── ONE MODEL TO RULE THEM ALL ──────────────────────────────────────────
    # Single source of truth for "which LLM". Every text/vision task (vision /
    # chunking_assist / contextual_summary / knowledge_map summary / refine /
    # graph.llm) INHERITS this primary+fallback unless it declares its own.
    # Change the model once here → it changes everywhere. To use a different
    # model for one task, add a `primary:` (and optional `fallback:`) under
    # that task below — an explicit per-task block always wins over this.
    #
    # NOT covered (these are role-specific models, intentionally separate):
    #   - models.audio_transcription  → ASR (Qwen3-ASR / Whisper)
    #   - graph.embedding             → embedding model (text-embedding-3-small)
    #
    # There is NO hard-coded model name in code — provider.py fails loud if a
    # task somehow has no model, rather than silently substituting one. So this
    # YAML is the only place a model name lives ("env flexible, config not
    # silently overridden by a hard-coded default").
    primary:
      provider: "google"
      model: "gemini-3-flash-preview"
      api_key_env: "GEMINI_API_KEY"
    fallback:
      provider: "openai"
      model: "gpt-5.4-mini"
      api_key_env: "OPENAI_API_KEY"
    # Cheaper Vision alternative — gemini-3.1-flash-lite-preview (~half the
    # token price). We tested it head-to-head on a mixed real doc (CSR report
    # screenshots + handwriting) and kept Flash as the default: Lite read plain
    # text and chart NUMBERS just as well, but lost table column structure,
    # UNDER-marked [unreadable] on genuinely obscured cells (an anti-hallucination
    # regression — DocIngest's whole point is flagging uncertainty, not hiding
    # it), transcribed ~17% less, and was actually SLOWER on the current preview
    # endpoint. If your inputs are text-light and cost is the only constraint,
    # opt in by setting model above to "gemini-3.1-flash-lite-preview".

    # Output budget for every LLM call. Set to 65536 (Gemini 3 Flash /
    # 3.1 Pro hard ceiling per https://ai.google.dev/gemini-api/docs/models).
    # Gemini's per-request default is only 8192 if maxOutputTokens is omitted,
    # so we must set this explicitly to unlock the full 64K. GPT-5.4-mini
    # supports 128K but the fallback chain is capped by the smaller side.
    max_response_tokens: 65536
    # Retry once when the LLM stops with finish_reason="length" (response cut
    # off by the token limit). Retry doubles the budget up to retry_max_tokens.
    retry_on_truncation: true
    retry_max_tokens: 65536
    # Network-level retry count passed to litellm (rate limits, 5xx, TCP
    # resets). Orthogonal to retry_on_truncation above — both can fire for
    # the same call. Set to 0 to disable; litellm's own default is 0, but
    # production workloads benefit from at least 2 retries with exponential
    # backoff to survive transient Gemini/OpenAI hiccups.
    max_retries: 2

  vision:
    # primary / fallback INHERITED from models.defaults (one-model-to-rule).
    # To pin Vision to a different model, add a `primary:` block here.
    #
    # Local OCR backend (opt-in, GPU required). When ocr_backend is set, the
    # OCR / page-transcription task (describe_image) runs on a LOCAL model
    # instead of the cloud provider — useful for offline / data-stays-local /
    # cost-sensitive setups, and the local model self-emits per-element layout
    # boxes. IMPORTANT: this swaps ONLY the page-reading task. Summary /
    # chunking-assist / refine / graph are text tasks routed through
    # text_completion and ALWAYS keep using the cloud primary above — a local
    # OCR model can't do them. Needs the [local-ocr] extra (torch+transformers);
    # missing deps fail loud with an install hint. null = cloud Vision (default,
    # nothing changes). The local model auto-inherits the existing render /
    # triage / cache / anti-hallucination pipeline.
    ocr_backend: null              # null | "unlimited_ocr"
    ocr_model: "baidu/Unlimited-OCR"   # HF id or local weights path
    ocr_device: "cuda"             # cuda | cpu (cpu is very slow)
    ocr_keep_boxes: false          # reserved: keep per-element layout boxes
    #
    # Per-task override; falls through to models.defaults.max_response_tokens
    # when unset. Kept explicit at the provider ceiling (65536 = Gemini 3 Flash
    # / 3.1 Pro hard limit) so dense PDF / multi-page sheet / 方眼紙 仕様書
    # Vision calls never hit silent finish_reason="length" truncation.
    max_response_tokens: 65536
    # Wall-clock cap per Vision call (single page). null = no timeout.
    # Catches hung API calls so as_completed() doesn't wait forever.
    # Independent of litellm's network-level retry — this bounds the
    # whole call (incl. retries) at the application layer.
    timeout_sec: 180
    # Wall-clock cap for a batched Vision call (multi-page in one request).
    # The batched path scales the cap with batch size up to this ceiling, so
    # a 10-page batch doesn't get only the single-page budget. null = no
    # ceiling (still bounded by timeout_sec × batch_size). The ceiling is
    # separate from timeout_sec because batched calls are inherently longer
    # than single-page ones, and a 600 s industry-typical max would silently
    # truncate large-batch supplements on dense PDFs.
    batch_timeout_max_sec: 1800

  chunking_assist:
    # primary / fallback INHERITED from models.defaults.
    {}

  contextual_summary:  # Only used when enrichment.contextual_summary = true
    # primary / fallback INHERITED from models.defaults. (Previously pinned to
    # gpt-5.4-mini with no fallback; now follows the unified default chain.)
    {}

  # Audio transcription (ASR) — used by MediaParser for audio/video files
  # when no subtitle file is available. Same primary/fallback chain as Vision.
  audio_transcription:
    primary:
      provider: "dashscope"               # Qwen3-ASR (default, recommended)
      model: "qwen3-asr-flash"            # base64 multimodal API, fast, no upload needed
      api_key_env: "DASHSCOPE_API_KEY"
    fallback:
      provider: "openai"                  # Whisper (broad language support)
      model: "whisper-1"
      api_key_env: "OPENAI_API_KEY"

# =============================================================================
# Phase 1: Document Parsing
# =============================================================================
parsing:
  engine: "docling"           # docling | docling_with_fallback | azure_di | vision_only
                              # azure_di = OPT-IN plugin (docingest.azure): parse in
                              # Azure Document Intelligence's cloud instead of local
                              # docling (cloud parse = zero local memory pressure).
                              # Needs the [azure] extra + credentials (see
                              # parsing.azure_di below).
                              #
                              # vision_only = skip Docling parsing on PAGE-IMAGE formats
                              # (PDF / png / jpg / ...): render each page (PyMuPDF, fast,
                              # no OOM) and let per-page Vision read the WHOLE page. Other
                              # formats auto-delegate to the docling path (xlsx stays
                              # openpyxl, docx/pptx stay docling, text stays text, audio
                              # stays ASR). Trade-off — HONEST: every page is transcribed
                              # by the Vision model (no Docling text → no triage skip), so
                              # LLM token cost is HIGHER; in return you get OOM-immunity
                              # and better fidelity on dense data-table pages Docling
                              # collapses. Wall-clock mitigated by the Vision concurrency
                              # pool (parsing.parallel). Choose deliberately.

  # Azure Document Intelligence backend config (only read when engine=azure_di).
  # Credentials resolve: DocIntelligenceProvider > these values > env
  # (AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT / _KEY). Leave null to use env.
  azure_di:
    endpoint: null            # https://<resource>.cognitiveservices.azure.com/
    api_key: null             # resource key (prefer env / provider over committing here)
    model_id: "prebuilt-layout"   # DI model; prebuilt-layout = generic doc → markdown

  # Global page cap — parse only the FIRST N pages of each paged document
  # (PDF / PPTX / DOCX — anything Docling counts in pages). null = no cap
  # (parse everything, the default). Pages past N are never rendered, so this
  # genuinely saves layout-model + Vision work on big files (e.g. a 300-page
  # report you only need the first 30 of), and the cost preview reflects N.
  # Per-run override (no code change): ingest(..., config_overrides={"parsing.max_pages": 30}).
  # Does NOT affect non-paged inputs (plain text, audio/video) — they have no pages.
  max_pages: null

  # Wall-clock cap for a single file's parse step. null = no timeout.
  # A hung Docling call (rare but possible on malformed PDFs) is caught
  # here so the rest of the pipeline keeps moving. The file is recorded
  # as failed with error_type="timeout".
  #
  # This is the FIXED fallback value — used when dynamic_timeout is off, or
  # when the page count can't be probed (non-PDF inputs: video, audio, html,
  # ...). With dynamic_timeout on (default), paged PDFs get a budget scaled
  # to their size instead (see below). 600 s covers most long-form video
  # going through native_video (a 40-min clip's Gemini call takes ~5-7 min);
  # tune higher for multi-hour content or lower for short-doc-only corpora.
  timeout_sec: 600

  # Size-aware parse timeout. A single flat cap is wrong at both ends: too
  # short for a big book (519-page WEO needs ~1100 s just to parse), too long
  # for a tiny file that's actually hung. So scale the budget by page count:
  #   timeout = clamp(base_sec + per_page_sec * pages, base_sec, max_sec)
  # Page count is probed cheaply (PyMuPDF xref, O(1)) for PDFs; if it can't be
  # determined (non-PDF, probe failure), we fall back to the fixed timeout_sec
  # above — never blocking the parse on a failed probe.
  dynamic_timeout:
    enabled: true
    base_sec: 120        # floor — also covers fixed per-file overhead
    per_page_sec: 3      # added per page (519 pages → ~1677 s)
    max_sec: 1800        # ceiling — a genuinely hung file still dies eventually

  # Generic Markdown post-processing — applied to all non-xlsx formats
  # (PDF / DOCX / PPTX / HTML / plain Markdown). The xlsx path has its own
  # richer denoising under parsing.xlsx.denoising.
  markdown:
    # Collapse merged-cell duplication inside Markdown table rows.
    # Docling expands a single cell that spans N columns into N identical
    # cells, turning one piece of content into N× the tokens. The collapse
    # is safety-gated inside the implementation: only applied when it
    # removes ≥50% of cells in a row (strong signal of merge noise, not a
    # legitimate data table with coincidental duplicates).
    dedup_table_rows: true

  # OCR settings (auto-triggered for scanned documents)
  ocr:
    # Docling's built-in OCR (RapidOCR/EasyOCR). Per-page Vision already reads
    # image content far more accurately; Docling's default RapidOCR model is
    # Chinese, so on Japanese / other-language image PDFs it emits
    # Simplified-Chinese garbage that pollutes output AND wastes time (~16x
    # slower on image-heavy pages). Disable to let Vision own all image
    # reading. Safe to disable because triage now sends every page carrying
    # picture elements to Vision via an OCR-independent signal
    # (PageData.num_pictures). Keep true only when processing scanned PDFs
    # WITHOUT a Vision provider configured. `doctor` warns if you disable OCR
    # without a Vision key (image-only pages would then yield nothing).
    enabled: false            # false (default): Vision-only, Docling OCR off.
                              # true: re-enable Docling OCR (scanned PDFs when
                              # no Vision provider is configured).
    engine: "auto"            # auto | easyocr | tesseract | rapidocr (used only when enabled)
    languages: ["eng", "jpn", "chi_sim"]
    force: false              # true: force OCR even on text-layer PDFs

    # Pre-downloaded RapidOCR model paths. When set, all three must be set
    # together — DocIngest will pass them directly to docling's
    # RapidOcrOptions(det_model_path=..., cls_model_path=..., rec_model_path=...).
    # This bypasses RapidOCR's default site-packages download location, which
    # fails on non-root containers (docling issue #2500). Setting these also
    # FORCES engine="rapidocr" — otherwise docling's auto-pick might land on
    # EasyOCR/Tesseract and ignore the paths silently.
    #
    # Download the models once in your Dockerfile with:
    #   rapidocr download_models --config /app/rapidocr.yaml
    # then point each path here at the resulting .onnx file.
    #
    # Default null = use RapidOCR's built-in download location (fine for
    # local dev / root containers; broken for non-root prod containers).
    rapidocr_model_paths:
      det: null               # e.g. "/app/models/rapidocr/ch_PP-OCRv4_det_mobile.onnx"
      cls: null               # e.g. "/app/models/rapidocr/ch_ppocr_mobile_v2.0_cls_mobile.onnx"
      rec: null               # e.g. "/app/models/rapidocr/ch_PP-OCRv4_rec_mobile.onnx"

  # Language detection
  language_detection: "auto"  # auto | fixed value ("ja", "en", "zh", etc.)
  # auto: detect via character distribution (no AI, fast)

  # Vision (per-page AI enrichment)
  # Every page is sent to Vision AI with Docling text as context.
  # The AI decides what to do (no code-level thresholds or filtering).
  vision:
    enabled: true             # true | false — master switch
    # Demote markdown headings inside SUPPLEMENT-mode outputs and
    # embedded-figure transcriptions to bold lines. Vision writes `###` for
    # chart titles / axis legends; in full mode (PDF/PPT) those headings ARE
    # the page's structure and stay, but in supplement/figure blocks they
    # are figure-internal labels that otherwise enter the document's heading
    # hierarchy — measured: a thesis whose own chapters were bold paragraphs
    # ended up with 118/325 chunks carrying a chart's name as title_path,
    # and the bogus headings tricked the auto-chunker's structure scoring.
    # Every word is kept (chunk text / grep / RAG recall unchanged); only
    # the structural claim is removed. false = inject blocks verbatim.
    supplement_demote_headings: true
    supplement_only: false    # GLOBAL DEFAULT = false (full whole-page Vision).
                              # Per-format override below flips xlsx to true.
                              # WHY format-split (measured, not guessed):
                              #   PDF/PPT 方眼紙 tables get FLATTENED into
                              #   fragments by Docling's layout model (it never
                              #   classifies them as a table). Only FULL Vision
                              #   transcription recovers them. supplement there
                              #   silently DROPS body text — Vision sees the
                              #   non-empty fragment and assumes Docling has it
                              #   (verified: contract page recall 8/8 full vs
                              #   4/8 supplement). So PDF/PPT MUST stay full.
                              #   xlsx is different: the openpyxl renderer
                              #   already emits CLEAN structured tables, so
                              #   Vision only needs to SUPPLEMENT visuals, not
                              #   re-transcribe — flipped on via
                              #   parsing.xlsx.vision.supplement_only. xlsx body
                              #   text lives in the openpyxl render, which
                              #   supplement never touches → cannot drop it.
                              # full-mode duplication measured at only 1-9% of
                              # the document, almost all of it xlsx tables that
                              # the xlsx-supplement override then removes.
    # Text-layer character authority (FULL mode only). Each PDF page's raw
    # EMBEDDED TEXT LAYER (pymupdf get_text — character-exact, never OCR) is
    # read alongside Docling's layout output. When that layer is healthy
    # (non-empty, no glyph< CMap damage, U+FFFD ratio <= 5%), it REPLACES the
    # reference text fed to Vision and the prompt upgrades it to
    # authoritative: when a visually-read character CONFLICTS with it
    # (stamps, seals, blur, occlusion, small print), the text layer wins;
    # Vision's job is layout/structure and visual-only content. Why not feed
    # Docling's output as the authority: its layout pass can DROP text
    # overlapped by pictures (measured: signature line under a seal).
    # Unhealthy pages (scans → empty layer, CMap-damaged → garbled) keep the
    # old low-trust wording and Docling reference — behaviour unchanged.
    # Real case: a red corporate seal over 「良」 made Vision confidently read
    # 「典」 while the text layer held the correct character (退職証明書).
    # supplement mode is unaffected (its ground truth is already authoritative).
    text_authority:
      enabled: true           # false = always use the old wording (rollback)
    max_pages: null           # Global cap on Vision API calls per file. null
                              # (default) defers to the `safety:` section for
                              # cost control — safety.mode=warn/strict runs a
                              # pre-flight budget check and prompts the user
                              # BEFORE any LLM call. A hard cap here would just
                              # silently truncate (159-page xlsx → drop pages
                              # 51-159 with no signal to the caller), which is
                              # information loss disguised as defence. Set an
                              # int here only if a specific workload needs a
                              # tighter cap independent of safety budget.
    image_dpi: 200            # resolution for page images sent to Vision.
                              # 72 = fastest/smallest (readable for large text only)
                              # 150 = good balance (main elements clear, small labels fuzzy)
                              # 200 = recommended default — the industry-balanced point
                              #       (A4 ≈ 2.3MP, well under the 4MP cap). Measured on a
                              #       dense IEA chart page: 180→200 is +12% input tokens
                              #       (Gemini bills per 768px tile, so it's a step not a
                              #       slope) for clearer small labels.
                              # 250+ = no real gain over 200 (same tile count) AND a
                              #       larger page can breach the 4MP cap → silent
                              #       downscale, so it can cost more for nothing.
                              # Gemini charges per-tile, OpenAI/Claude by tile/pixel count.
    progress_interval: 1      # How often the on_progress callback fires a
                              # "file_progress" event during Vision (every N
                              # pages). 1 = every page (smoothest UI bar).
                              # Vision is the longest silent stretch inside one
                              # file, so per-page reporting keeps a GUI / SSE
                              # progress bar alive instead of frozen. Raise this
                              # for very long documents if per-page events flood
                              # the UI. Does NOT affect output — purely a
                              # reporting cadence, so it is intentionally NOT in
                              # incremental.py's cache whitelist.
    # Systemic-failure handling: what to do when EVERY Vision page call for a
    # file fails AND the failed pages are "content-critical" — i.e. pages that
    # depend on Vision for their content (scanned docs whose Docling text is
    # empty, or garbled pages Vision was meant to repair). This is deliberately
    # NARROWER than single-page failure: an isolated page failing always keeps
    # its Docling text as fallback and is NEVER controlled by this knob.
    # Background: when an API key expires / quota is exhausted / all models are
    # down, the old behaviour silently reported success and produced an empty
    # knowledge base (measured: scanned PDF + total Vision failure → md left as
    # just "<!-- image -->", quality_score 1.0, exit code 0). This makes that
    # case fail loud instead.
    on_systemic_failure: error  # error  = raise + mark THIS file failed (default,
                                #          fail loud); the run keeps processing
                                #          other files.
                                # warn   = do not fail the file, but log at ERROR
                                #          level so the failure is impossible to miss.
                                # ignore = legacy behaviour (stay silent) — a
                                #          backward-compat escape hatch.
    systemic_failure:
      min_critical_pages: 1     # Trigger only when at least this many FAILED
                                # pages were content-critical (default 1: a
                                # single page left with no content is enough).
      min_meaningful_chars: 10  # A failed page counts as "empty content" when,
                                # after stripping "<!-- image -->" /
                                # "<!-- pagebreak -->" placeholders and
                                # whitespace from its Docling text, fewer than
                                # this many real characters remain. (A scanned
                                # page's Docling text is "<!-- image -->", not
                                # "", so a bare len()==0 test would miss it.)
    triage:
      enabled: true             # true = skip pages that are purely text (saves API cost)
                                # false = all pages sent to Vision (maximum quality, higher cost)
      min_text_length: 50       # Pages with less text than this → always send to Vision
      max_replacement_ratio: 0.05  # U+FFFD ratio above this → always send to Vision
      entity_garble_check: true # Detect OCR garble where a CJK char was truncated
                                # into an HTML entity (確認 → 確&lt;). Matches ONLY
                                # a CJK char directly followed by &lt; — so it does
                                # NOT misfire on Japanese headings wrapped in <…>
                                # (`## &lt;入居中…&gt;`, entity precedes the CJK) or
                                # on code/HTML prose (`vector&lt;int&gt;`). Set false
                                # to disable this single check.
      table_line_threshold: 30  # Markdown table rows above this → send to Vision.
                                # Raised from the earlier 10 after real-world
                                # 仕様書 / API spec / Q&A 表 testing: nearly
                                # every page in those docs has 10+ rows of
                                # routine tables that Docling handles fine,
                                # so the old threshold of 10 sent ~100% of
                                # pages to Vision unnecessarily. 30 still
                                # catches the giant merged-cell tables where
                                # Vision actually helps verify structure.
      max_mixed_script_fragments: 8  # Mixed-script anomaly count above this
                                    # → send to Vision. Detects CJK mismap
                                    # garbling (e.g. する→寸, 査→查) via
                                    # short ASCII (1-3 chars) directly
                                    # adjacent to CJK characters.
                                    # Raised from the earlier 3 after real
                                    # Japanese technical-spec testing:
                                    # legitimate jargon like "プロトコルHTTP1.1",
                                    # "方式client_secret_jwt", "TLS1.2以上"
                                    # routinely produces 3–6 fragments per
                                    # page. 8 keeps the OCR-garbling signal
                                    # (real cases produce 10+ per page) while
                                    # no longer flagging clean tech prose.

      # Language-script consistency check — the strongest signal for CMap
      # failures that produce CLEAN but WRONG Unicode (e.g. Docling yielding
      # Bengali/Thai/Tibetan characters on a Japanese-declared document).
      # The other garble checks miss this case: legal Unicode, no glyph<,
      # no U+FFFD, no CJK mismap sandwich — just the wrong script entirely.
      #
      # For each configured language, list the Unicode scripts that are
      # legitimately allowed. Anything outside the whitelist counts toward
      # the unexpected ratio. "Common" (digits, punctuation, whitespace,
      # CJK punctuation, fullwidth forms) is always allowed automatically.
      #
      # Add a new language = add a line here. No code changes needed.
      language_script_check:
        enabled: true
        max_unexpected_script_ratio: 0.05   # >5% unexpected characters → send to Vision
        min_text_length_for_check: 50       # skip very short pages (random noise risk)
        expected_scripts:
          ja: [Latin, Han, Hiragana, Katakana]
          zh: [Latin, Han, Hiragana, Katakana]   # Chinese docs sometimes embed kana
          en: [Latin]
          ko: [Latin, Hangul, Han]

      # Latin-script cipher-garble check — the sibling of language_script_check
      # for the case where a broken font CMap maps each glyph to a DIFFERENT
      # legal Latin letter (e.g. "Nutrition" → "Pgvsdvdfp"). The output is clean
      # ASCII: no glyph<, no U+FFFD, no CJK, every char is still "Latin" script —
      # so glyph / replacement-ratio / mixed-script / language-script checks all
      # pass and the unreadable page would be skipped. The only surviving signal
      # is statistical: natural Latin prose runs ~30-45% vowels, a letter
      # permutation collapses that to single digits.
      #
      # Validated on real corpus: 164 genuine EN/JA page blocks → 0 false
      # positives; 222 ciphered pages (two cipher families) → 100% caught. Real
      # EN pages bottomed out at 29% vowels, ciphered topped out at 19%, so the
      # 0.20 default sits in a wide safe gap.
      #
      # A trigger only sends the page TO Vision (which re-reads the image) — it
      # can never drop content — so this is a pure safety net. Default ON.
      latin_cipher_check:
        enabled: true
        min_letters: 30           # need at least this many Latin letters to make
                                  # a statistical call (short labels / number-
                                  # heavy / non-Latin pages fall below → skipped)
        max_vowel_ratio: 0.20     # vowels / Latin-letters below this → cipher.
                                  # Real prose ≥29%, cipher ≤19% on the test
                                  # corpus; 0.20 is the midpoint of that gap.
        max_cjk_share: 0.40       # if CJK chars are >40% of (CJK+Latin), the page
                                  # is CJK-dominant → out of scope (its own garble
                                  # detectors handle it; inline English must not
                                  # trip this check).

      # Furniture-picture exemption (PDF only, default OFF / opt-in).
      # A text page whose ONLY images are cross-page "furniture" — a logo /
      # header / footer / watermark that repeats on most pages — carries no
      # per-page visual information. Without this, a single repeating logo
      # forces EVERY page of a "logo + body text" document (common in
      # corporate reports / contracts) to Vision. Turn this on to skip those
      # pages. STRICT by design — any of these keeps a page on the Vision path:
      # a non-furniture picture (chart / stamp), ANY table markup, low text,
      # garble. A single-page image is never furniture (cross-page repetition
      # is required), so body text disguised as an image is still sent.
      # Off by default because it is a cost optimisation, not a correctness
      # fix — enable it only after confirming your corpus has repeating
      # decorative furniture worth skipping.
      furniture_exempt:
        enabled: false            # true = skip text pages whose only images are furniture
        repeat_page_ratio: 0.6    # an image must appear on >= this fraction of pages to
                                  # count as furniture (0.6 = 60%). Higher = stricter.
                                  # Uses image CONTENT HASH, not xref (same logo is often
                                  # re-embedded under a new xref per page).
        max_area_ratio_pct: 50.0  # images larger than this % of the page are NEVER
                                  # furniture even if they repeat — a full-page repeating
                                  # image is a SCANNED PAGE, which must go to Vision.
        min_doc_pages: 3          # documents shorter than this don't use the exemption
                                  # (on a 2-page file a logo trivially "repeats on 100%
                                  # of pages" — too little signal to risk skipping).

    # Batched multi-image Vision call — for xlsx whose single sheet renders
    # to multiple PDF pages (long 方眼紙 / cross-page tables). Independent
    # experiments (see notes in pipeline._enrich_with_vision) showed that
    # sending all 11 pages of one sheet in a single Gemini Vision call beats
    # per-page calls 90% vs 18% on substring coverage and 10/10 vs 1/10 on
    # cross-page continuity — because Vision can stitch table continuations
    # across page boundaries when it sees them together. Only triggered for
    # xlsx/xls; other formats keep per-page calls (where the assumption
    # breaks down — PDF pages are usually independent).
    batched_call:
      enabled: true                  # false → always per-page (rollback switch)
      min_pages_per_sheet: 1.5       # trigger when pages/sheet ≥ this. DB-spec
                                     # xlsx (13 sheet → 16 page = 1.2) stays
                                     # per-page; USDM-style (4 sheet → 18 page
                                     # = 4.5) triggers batched.
      max_images_per_batch: 20       # Per-batch image cap (NOT a "fall back to
                                     # per-page if total > N" gate). Once the
                                     # ratio above qualifies a file for batched,
                                     # all its pages go batched — large files
                                     # split into ceil(total / max_batch)
                                     # parallel batches (concurrency from
                                     # performance.parallel_files). 20 chosen
                                     # after A/B on a 159-page xlsx with
                                     # batch=5/10/20: smaller batches do NOT
                                     # improve Vision quality on the real
                                     # bottleneck (LibreOffice-rendered
                                     # half-cropped wide sheets read by Vision
                                     # as "[unreadable]"); Docling openpyxl
                                     # extraction already covers those cells
                                     # 100% so per-batch detail loss is moot.
                                     # 20 gives best wall-clock + token cost.
                                     # Bounds each model
                                     # call's context window (Gemini 3 Flash
                                     # comfortably handles 20 images per call;
                                     # raise only if you've tested your model
                                     # handles more without quality drop).

  # PDF-specific
  pdf:
    # Extract files embedded in the PDF's /EmbeddedFiles tree (PDF "attachments"
    # — whole files carried like email attachments, NOT page images). When on,
    # each attachment is pulled out as an independent input file and processed
    # by its own path (image → Vision, child PDF → PDF parse, xlsx → openpyxl),
    # named <parent_stem>__<attachment_name>. The parent PDF is still parsed for
    # its own page body. Default on: probing is cheap (~10-40ms, .pdf only) and
    # most PDFs carry none, so the cost on attachment-free PDFs is negligible.
    # Turn off to skip the probe entirely. Attachments DO add Vision/parse cost
    # when present — the safety budget estimate prices them like any input.
    extract_attachments: true
    # Who renders PDF page images for per-page Vision.
    #   docling (default): use Docling's built-in page render (generate_page_images).
    #                      On the normal path Docling parses the PDF anyway, and
    #                      its page render rides along nearly for free — MEASURED
    #                      increment ~2.5s for 40 pages, same as PyMuPDF (no win
    #                      from switching). So the default stays Docling.
    #   pymupdf:           render with PyMuPDF directly; Docling's page render is
    #                      then disabled. Only worth it if you ever run a path that
    #                      does NOT need Docling's parse (e.g. a vision-only mode) —
    #                      there, paying Docling's full parse just to get page
    #                      images is wasteful (and can hit the Windows OOM bug),
    #                      and a standalone PyMuPDF render is the right tool.
    # Either way the images feed Vision identically (same DPI, 4 MP cap). PyMuPDF
    # unavailable / a render error → auto-falls back to Docling's render (fail
    # soft: page images only feed Vision, never affect text).
    page_image_renderer: docling
    table_extraction: true
    # How Docling assigns text to recognised table cells.
    #   true  (default): map structure back to the PDF's own text cells —
    #                    best for clean, regular tables.
    #   false:           read text from the model-predicted cell grid by
    #                    coordinates. Recovers VERTICALLY-merged columns that
    #                    `true` silently drops (e.g. a category column whose
    #                    value spans many rows), BUT can duplicate/smear text on
    #                    densely HORIZONTALLY-merged tables. Not a blanket
    #                    accuracy win — flip per project only when the default
    #                    drops a column. Measured: rescues vertical-merge specs
    #                    / nutrition tables; degrades nested invoice tables.
    table_cell_matching: true
    image_extraction: true
    # (page cap lives at the global parsing.max_pages — applies to all paged
    #  formats, not just PDF; the old per-PDF knob here was never wired up.)
    hidden_text_detection:
      enabled: true           # Detect hidden/invisible elements via Docling ContentLayer

    # === LAST-LINE-OF-DEFENSE batched re-parse (kept permanently) ===
    # Origin: docling-parse (the C++ PDF backend) used to throw intermittent
    # std::bad_alloc on Windows for multi-page PDFs, silently dropping pages
    # (status PARTIAL_SUCCESS). That upstream bug is FIXED in docling-parse
    # 7.4.0+ (issue #227 / PR #287, merged 2026-07-01; verified on this
    # machine 2026-07-04 with docling 2.109.0 + docling-parse 7.5.0: the
    # 75-page repro now parses whole-doc SUCCESS, 0 bad_alloc).
    # See docs/docling_parse_OOM_Windows_长期监控.md for the full history.
    #
    # The mechanism stays: when a whole-document parse drops pages even after
    # one retry — for ANY reason (upstream regression, malformed PDF, other
    # memory issues) — we re-parse in small page batches, rebuilding the
    # converter between batches to release native memory. It triggers solely
    # on a detected partial parse, so healthy PDFs pay nothing.
    oom_batch_fallback:
      enabled: true           # set false to disable and fail loud on partial parse instead
      batch_size: 10          # pages per batch. Measured on a 75-page PDF: batches of
                              # 8/10/12 all parsed 0-error; 15 still dropped pages. 10
                              # keeps a safety margin below the ~15 crash threshold while
                              # minimising converter rebuilds (slower path: ~7x a clean
                              # whole-doc parse, but it ONLY runs when the doc already failed).

      # PROACTIVE batching — split very large PDFs up front. The same
      # batched-parse machinery as the fallback above, but triggered by page
      # count rather than a detected failure. Produces the SAME seamless
      # single-file output as a whole-doc parse (chunks stay attributed to the
      # original file — verified), so it's invisible to downstream RAG /
      # Agentic Search.
      #
      # DISABLED 2026-07-04 (user decision) after the upstream fix landed
      # (docling-parse 7.5.0): whole-doc peak RSS is now nearly
      # page-count-independent (75p = 2.5GB, 519p = 3.1GB — the upstream cache
      # cap also killed the old linear memory growth, which used to hit 8GB on
      # 519p), so proactive splitting no longer buys anything on measured
      # inputs. Every PDF takes the whole-doc path (best quality — no
      # batch-boundary title_path drift); if a parse ever fails, the reactive
      # fallback above still catches it. Historical values kept below in case
      # unmeasured territory (1000p+) ever proves otherwise.
      # (above_pages history: 50 = bug-era measured crash wall; 500 = the
      # briefly-planned post-fix ceiling, superseded by disabling proactive.)
      proactive:
        enabled: false        # off: whole-doc for every PDF; reactive fallback still active
        above_pages: 500      # only relevant if re-enabled
        batch_size: 50        # only relevant if re-enabled

    # Optional per-format Vision override. Any field listed here overrides the
    # global models.vision.* / parsing.vision.* setting for THIS format only.
    # Supported keys: model, max_response_tokens, image_dpi.
    # Unset fields fall through to the global config.
    vision:
      # max_response_tokens: 32768
      # image_dpi: 200
      # model: { provider: "google", model: "gemini-3-pro-preview" }

  # PPT-specific
  # Docling extracts text from PPT but image generation depends on the backend
  # pipeline. When page images are missing, render via LibreOffice → PDF →
  # screenshots so Vision AI can describe slide visuals.
  pptx:
    include_notes: true         # include speaker notes
    vision_page_images: true    # LibreOffice → PDF → page screenshots → Vision
    max_page_images: null       # null (default) = no per-format cap. Cost control
                                # is the `safety:` section's job (pre-flight budget
                                # check + warn/strict, user-approved). A hardcoded
                                # cap here would silently drop slides past N to
                                # text-only — information loss disguised as defence,
                                # same anti-pattern we removed from xlsx and
                                # parsing.vision.max_pages. Set an int only if a
                                # specific workload needs a tighter local limit.
    max_image_pixels: 4000000   # auto-downscale oversized page images

    # Chart data direct-read.
    # Reads chart category / series / values straight from the pptx object
    # model (python-pptx) and injects them as Markdown tables into the
    # corresponding slide section, BEFORE Vision runs. This guarantees
    # 100% accurate chart numbers even when the rendered slide image is
    # blurry or the chart type defeats Vision OCR. Unsupported chart
    # types (Waterfall / Treemap / Sunburst etc.) silently fall through
    # to the existing Vision-only path.
    extract_chart_data: true

    # Embedded picture extraction — same path as docx. Docling decodes pptx
    # pictures (ppt/media/*) into doc.pictures WITH pixels, so a text-filled
    # bitmap on a slide (a pasted screenshot, an SVN/Git comparison diagram)
    # gets saved to assets/ and read at full resolution by Vision — instead of
    # being summarised away in the whole-slide image pass. Measured: the
    # whole-slide pass read such a diagram only ~3/8 of the time (jitter); the
    # full-res figure read got it 8/8 (scratchpad t8).
    image_extraction:
      enabled: true
      min_dimension: 200         # px; smaller on BOTH sides (slide icons) → not sent
      vision_enrich: true        # false = extract + mark only, zero extra API cost
      max_images_vision: null    # null = read EVERY qualifying figure (no silent
                                 # truncation — a slide deck legitimately has many
                                 # figures; dropping some past N would be info loss
                                 # disguised as cost defence). Cost is surfaced
                                 # up-front by the safety pre-flight, not hidden by
                                 # a cap. Set an int only for a specific tight job.

    # Optional per-format Vision override. See parsing.pdf.vision for usage.
    vision:
      # max_response_tokens: 8192     # PPT 文字大、内容稀，可省 tokens
      # image_dpi: 150                # 截图低分辨率即可
      # model: { provider: ..., model: ... }

  # Word-specific
  # Docling extracts text + table structure from DOCX, but does NOT render page
  # images, so embedded diagrams, screenshots, and figures are lost. Rendering
  # the document via LibreOffice → PDF → screenshots lets Vision AI describe them.
  docx:
    vision_page_images: true    # LibreOffice → PDF → page screenshots → Vision
    max_page_images: null       # null (default) = no per-format cap. Cost control
                                # belongs to `safety:` (pre-flight, user-approved),
                                # not to a silent post-hoc truncation here. Long
                                # specs / 仕様書 / manuals routinely run 30-80 pages
                                # of which figures matter; a 20-cap dropped 60% of
                                # the visual content unannounced. Same anti-pattern
                                # we removed from xlsx and parsing.vision.max_pages.
                                # Set an int only when a workload genuinely needs a
                                # tighter local limit.
    max_image_pixels: 4000000   # auto-downscale oversized page images

    # Math equations (OMML) → LaTeX preprocessing.
    # DOCX math is stored in Office Math Markup Language (m:oMath elements)
    # inside word/document.xml. Docling does NOT convert these to LaTeX —
    # equations are lost or garbled in the exported Markdown. When this
    # option is enabled, a pre-parse hook rewrites the DOCX in memory,
    # replacing every oMath element with a text run holding the LaTeX
    # equivalent ($E=mc^2$ style), before Docling sees the file. Documents
    # with zero equations incur zero cost (the hook returns None and the
    # original file is parsed directly).
    omml_to_latex: true

    # Optional per-format Vision override. See parsing.pdf.vision for usage.
    vision:
      # Supplement mode (like xlsx, unlike PDF/PPT): the page pass only ADDS
      # what the ground truth doesn't cover, instead of re-transcribing the
      # whole page. Sound for docx because its ground truth is trustworthy on
      # both fronts: body text is Docling reading OOXML directly (not a layout
      # model that fragments tables — the reason PDF/PPT must stay full), and
      # figures are covered by image_extraction below, which transcribes each
      # one at original resolution BEFORE the page pass runs. What the page
      # pass still catches: Word-layer mark-up (red-pen boxes / strikethrough
      # / comments live in the page render, NOT in embedded image pixels) and
      # any visual the extraction didn't reach. Full mode here re-transcribed
      # body + figures a second time (measured: 9.2k duplicate chars on a
      # 4-page doc) — slower, pricier, and double content in RAG chunks.
      supplement_only: true
      # Text-only skip: when the docx BODY has zero visual signals
      # (w:drawing pictures/charts, VML shapes, ink annotations, marker-pen
      # highlights, tracked changes — counted from the raw OOXML at parse
      # time), skip the LibreOffice render AND the page-Vision pass for the
      # whole file: Docling already read the complete body text from the
      # XML, so the page render can only show header/footer furniture.
      # Oracle-tested on signal-free real docs: every Vision supplement was
      # headers/footers/page numbers; annotated docs (red-pen ink, yellow
      # highlight) all carry signals and keep the full pass. Header/footer
      # pictures (logos) deliberately don't count as a signal. Any signal,
      # or a failed scan → full current behaviour. false = always render+send.
      skip_text_only: true
      # Per-page ground-truth slicing (docx variant of the xlsx switch).
      # The supplement page pass needs an "already captured" reference per
      # call; the full markdown repeated per page is the dominant input-token
      # share (measured: 92 pages x ~102k tokens = 9.4M on one thesis). docx
      # has no sheet map, but the SAME LibreOffice render that produced the
      # page images produced a PDF whose text layer is the page→content map:
      # each call gets its own page's text + that page's embedded-figure
      # transcriptions (anchored via the nearest body line above each image
      # marker; ambiguous anchors join no page). A/B verified: re-runs of an
      # already-captured table page answer "(no additional visual content)",
      # and the correction-style supplement (fixing [unreadable] in figure
      # transcriptions) survives. Any failure (no pymupdf, render failed)
      # falls back to the full markdown per page — the pre-slicing
      # behaviour. Scanned pages have an empty text layer; an empty ground
      # truth correctly triggers the full-transcription escape.
      ground_truth_slice: true
      # max_response_tokens: 32768
      # image_dpi: 200
      # model: { provider: ..., model: ... }

    # Embedded-image extraction (docx inline / anchored figures).
    # Why this exists: a docx whose tables are pasted as IMAGES (e.g. a
    # scoring rubric saved as a screenshot) loses its fine print to the
    # whole-page Vision pass — the figure is shrunk into the 1489px page
    # render and its small text goes [unreadable]. Docling already decodes
    # every embedded picture into doc.pictures (original pixels, in order);
    # we save each to assets/, rewrite the matching empty `<!-- image -->`
    # placeholder to `<!-- image: <file> -->` (so grep/RAG can locate it),
    # and — for figures above min_dimension — send the ORIGINAL-resolution
    # image to Vision once so its text is captured cleanly. Mirrors the
    # xlsx embedded-image marker convention; reuses Docling's own ordering
    # so no docx zip / OOXML parsing is needed.
    image_extraction:
      enabled: true              # save embedded pictures + write `<!-- image: file -->` markers
      min_dimension: 200         # px; images smaller on BOTH sides (e.g. a 120×120
                                 # OLE icon) are saved + marked but NOT sent to Vision
                                 # — reading an icon wastes an API call. Marker still
                                 # written so RAG can locate the asset.
      vision_enrich: true        # send above-threshold pictures to Vision at full
                                 # resolution (the fix for shrunk-figure [unreadable]).
                                 # false = extract + mark only, zero extra API cost.
      max_images_vision: null    # null (default) = no per-file cap on embedded-image
                                 # Vision calls. Cost control belongs to `safety:`
                                 # (pre-flight, user-approved) — inspect counts the
                                 # embedded media, the estimate prices every read, and
                                 # a figure-dense doc trips the strict gate for the
                                 # user to decide. The old 30-cap was the same silent
                                 # post-hoc truncation removed from max_page_images
                                 # above: it skipped 41/71 figures of a real thesis
                                 # unannounced (the page pass happened to re-read them
                                 # at lower resolution — coverage by accident, not
                                 # design). Set an int only when a workload genuinely
                                 # needs a tighter local limit; on trip: warn + skip
                                 # the rest, assets and markers still written.

  # ZIP archive expansion
  # Users often hand DocIngest a .zip full of mixed documents. When this
  # is enabled, zips are unpacked into a dedicated cache subdirectory and
  # their contents take the zip's place in the file list. Office Open XML
  # files (docx / pptx / xlsx) are technically zips but are NOT expanded —
  # they're handled by their native parsers.
  zip:
    enabled: true
    # Persistent extract directory (relative to output.dir/.cache). Kept
    # across runs so the second run hits the content-addressed cache
    # on the extracted files directly.
    extract_dir: "_zip_extract"
    # ZIP bomb / resource exhaustion defences. Any single limit tripping
    # refuses the whole archive — the original zip stays in the file
    # list and Docling surfaces the error.
    max_nesting_depth: 3              # max recursion for nested zips
    max_total_extract_size_mb: 500    # total uncompressed size cap
    max_file_count: 10000             # total entry count cap
    # Filename encoding fallback chain. Windows zip tools frequently
    # write CJK names with broken UTF-8 flags; this chain recovers the
    # real name. CP437 is deliberately NOT in this list — it's what
    # Python's zipfile defaulted to, and it's what we're trying to
    # escape. If you add cp437 here it will be auto-skipped.
    filename_encodings:
      - utf-8
      - cp932
      - shift_jis
      - euc-jp

  # Content-based format detection (magika, optional)
  # magika is Google's ML model that identifies file types from content.
  # DocIngest uses it as a fallback for weak extensions (bin, dat, tmp,
  # no extension at all) — the most common case is files extracted from
  # zip archives that lost their extensions. Strong extensions like .pdf
  # or .docx are trusted by default.
  # Install: pip install magika
  magika:
    enabled: true                 # only effective when `magika` is installed
    # Extensions that should trigger content-based override unconditionally.
    # The empty string "" matches files with no extension at all
    # (Dockerfile, README, etc.).
    weak_extensions:
      - ""
      - bin
      - dat
      - tmp
      - out
      - raw
      - dump
    # Set true to let magika override even strong extensions (.pdf, .docx
    # etc.). Conservative default is false — a mismatch between content
    # and a strong extension is more often a legitimate edge case than an
    # error, and Docling handles most mismatches internally anyway.
    correct_strong_extensions: false

  # Audio / video transcription
  # MediaParser handles these formats. Strategy: subtitle-first (look for
  # .srt/.vtt next to the file — 100% accurate, zero API cost), then ASR
  # fallback via models.audio_transcription.
  audio:
    formats:                               # audio extensions to accept
      - mp3
      - wav
      - m4a
      - flac
      - aac
      - ogg
      - wma
      - opus
    video_formats:                         # video extensions (audio extracted via ffmpeg)
      - mp4
      - avi
      - mkv
      - webm
      - mov
      - wmv
      - flv
      - ts
      - m4v
    prefer_subtitles: true                 # look for .srt/.vtt before calling ASR
    language: "auto"                       # "auto" = let ASR detect; or "ja", "en", "zh", ...
    context: ""                            # hotwords / domain terms for better ASR accuracy
    include_timestamps: true               # emit [MM:SS] markers in transcript Markdown
    max_segment_seconds: 150               # long audio split threshold (ffmpeg)
                                           # Qwen3-ASR-Flash has ~3min per-call limit,
                                           # 150s (2.5min) is the safe default
                                           # (same as qwen_asr.py's DEFAULT_SEGMENT_DURATION)
    ffmpeg_extract_timeout_sec: 600        # max wait for ffmpeg to strip the audio
                                           # track out of a video. Scales with video
                                           # length; 600 s covers ~2 h of HD video.
                                           # Raise for multi-hour content.

    # Video frame understanding (画面理解) — the audio track is always
    # transcribed via ASR above; this ADDS visual understanding by sampling
    # frames and feeding them through the SAME per-page Vision pipeline that
    # PDF/PPT pages use (frames become PageData entries → Phase 1.5 Vision).
    # No new model interface: a frame is just an image. Works with any Vision
    # provider (Gemini/Qwen/GPT/Claude all accept images).
    video_frames:
      enabled: true                        # sample video frames for visual understanding
                                           # (false = transcript-only, the old behaviour)
      interval_sec: 10                     # sample one frame every N seconds. Slides /
                                           # lectures change slowly → sparse default.
                                           # Lower it for fast-cut footage.
      max_frames: null                     # cap on frames per video. null = inherit the
                                           # global parsing.vision.max_pages cap, so a
                                           # video costs no more Vision than a same-length
                                           # text document of equivalent page count.
      skip_solid_frames: true              # drop near-uniform solid-colour frames
                                           # (black/blank slates) before Vision — they
                                           # carry no info and waste an API call. Judged
                                           # by grayscale stddev, robust to JPEG noise.

    # Native video understanding — send the WHOLE video to a video-capable
    # model in ONE call instead of sampling frames + per-frame Vision. The
    # model watches frames AND listens to the audio in a single pass, so the
    # transcript and the on-screen description come back already aligned on one
    # timeline (no ASR + frame-sampling + timestamp-stitching needed). Measured
    # vs. the frame-sampling path on a 100s screen-recording: 1 API call vs 10,
    # ~12K tokens vs ~50K, and far fewer [unreadable] markers (the model sees
    # the real video stream, not shrunk-down single frames).
    #
    # Provider support: ONLY "google"/Gemini today. With any other provider
    # configured, this path logs a warning and DEGRADES to frame sampling —
    # so leaving it ON never breaks a non-Gemini deployment, it just no-ops
    # back to the frame-sampling path. Subtitles still win when present
    # (cheapest + exact); native video only applies to video with NO subtitle.
    #
    # Cost guard: native video cost scales with DURATION (~300 tok/s for
    # Gemini). The pre-flight safety budget check already bounds this via
    # safety.per_file.max_duration_sec (default 30 min) — a long video trips
    # warn/strict and waits for --yes, exactly like a huge PDF. No separate
    # cap here (a post-hoc cap would be silent info loss, not defence).
    native_video:
      enabled: true                        # ON by default — for video without a
                                           # subtitle, use native video understanding
                                           # (one call, frames+audio together). The
                                           # default vision provider is Gemini, so
                                           # this works out of the box. Non-Gemini
                                           # providers / missing SDK auto-degrade to
                                           # the frame-sampling path. Set false to
                                           # force frame sampling for all video.
      fps: 1                               # frames/sec the model samples at.
                                           # Aligns with Gemini's own default (1).
                                           # Static screencasts/lectures: try <1
                                           # to save tokens; fast-cut footage: >1.
      files_api_threshold_mb: 20           # videos < this go inline (base64);
                                           # >= this upload via the Files API
                                           # (Gemini's 20MB inline-request limit).
      files_api_upload_timeout_sec: 600    # Max wait for the Files API upload
                                           # request itself. This protects the
                                           # network upload / resumable-upload
                                           # handshake before PROCESSING polling
                                           # begins. 600 s is intentionally
                                           # generous for 200+ MB videos on slow
                                           # links; lower it for short-video-only
                                           # workloads.
      files_api_poll_timeout_sec: 900      # Max wait for Files API PROCESSING
                                           # → ACTIVE after upload. Gemini's
                                           # server-side processing scales with
                                           # video duration: a 40-min / 234 MB
                                           # video can stay PROCESSING for
                                           # several minutes. 900 s covers
                                           # typical long-form video; raise for
                                           # multi-hour content.
      # model: inherits models.video_understanding if set, else models.vision
      #        (which inherits models.defaults). To pin a video-specific model,
      #        add a models.video_understanding.primary block.

  # URL resolution (yt-dlp)
  # When users pass an http/https URL as input, DocIngest downloads the
  # media + subtitles + metadata via yt-dlp (supports 1000+ sites).
  url:
    enabled: true
    download_dir: "_media"                 # relative to output.dir/.cache/
    yt_dlp_extra_args: []                  # additional yt-dlp flags (advanced)

  # Legacy binary Office (pre-2007 BIFF/CFB: .xls / .doc / .ppt) — converted to
  # their modern OOXML form (.xlsx / .docx / .pptx) via LibreOffice before the
  # rest of the pipeline sees the file. Docling only accepts the OOXML forms, so
  # without this the legacy file fails at parse. Once converted it flows through
  # the full modern-format path (Docling/openpyxl + Vision + chunking) with the
  # original filename / mimetype / binary_hash preserved in
  # metadata.lineage.original_input. LibreOffice missing → degrades to
  # TextParser fallback (gibberish, but pipeline never raises).
  xls:
    auto_convert_to_xlsx: true
  doc:
    auto_convert_to_docx: true
  ppt:
    auto_convert_to_pptx: true

  # Excel-specific
  xlsx:
    # AutoShape connector relationship extraction.
    # LibreOffice's xlsx → PDF rendering sometimes drops the terminal point
    # of arrow connectors (xdr:cxnSp), making画面遷移図 / フロー図 visually
    # incomplete on the screenshot Vision sees. This hook reads the OOXML
    # drawing XML directly, reconstructs source-box → target-box pairs by
    # geometric proximity, and feeds the list to Vision as ground-truth
    # structured data — same channel as PPTX chart direct-read. Vision then
    # trusts the relationship list for arrow direction and focuses on
    # labels / annotations / phase groupings that the list cannot convey.
    #
    # No effect on xlsx without drawings or without connectors. Failure
    # modes (encrypted xlsx / unreadable XML / no edges within proximity
    # threshold) silently skip via HookNoOp without polluting lineage.
    extract_connector_data: true

    # sheet → PDF page mapping via the LibreOffice PDF outline.
    # LibreOffice's calc_pdf_Export emits a level-1 PDF bookmark per
    # rendered sheet; pymupdf reads them and we resolve them back to
    # openpyxl sheet names (normalising whitespace because LO trims
    # trailing spaces and collapses internal runs in outline titles).
    # The map is consumed by xlsx_connector (correct page anchor when
    # sheet → multi-page) and future sheet-aware code.
    # RECALL SAFETY: never used to skip work. Missing/partial map ⇒
    # downstream falls back to legacy "1 sheet = 1 page" assumption.
    # No Vision page is ever dropped because of this map.
    # Disable only if pymupdf is unavailable or you observe mis-mapping
    # on a specific corpus (in which case please open an issue).
    sheet_page_map:
      enabled: true

    # Render xlsx directly via openpyxl instead of routing through Docling.
    # Why this is the default: Docling's Excel backend renders all sheets
    # into one flat markdown stream and *misaligns* sheet headings against
    # their bodies — content from sheet N can end up under sheet N-1's
    # `## name` heading. That contaminates chunk metadata (title_path
    # points at the wrong sheet) and silently breaks per-sheet retrieval.
    # openpyxl reads cells directly so every sheet's body is guaranteed
    # to live under its own heading. Merged cells stay as anchor-only
    # (no Docling-style cell duplication), columns that are entirely
    # empty across the sheet are pruned, and the existing
    # parsing.xlsx.denoising / vision / ensure_page_images logic still
    # applies on top.
    # Falls back to Docling automatically if openpyxl is not installed
    # or the workbook refuses to open. Flip to false to force the legacy
    # Docling path (e.g. for A/B testing or if your xlsx hits an openpyxl
    # bug — please file an issue when this happens).
    use_openpyxl_renderer: true

    # Excel denoising (applied to ALL xlsx/xls, not just 仕様書)
    # Data-heavy spreadsheets pass through with minimal change;
    # layout-heavy ones get significant noise removed.
    denoising:
      enabled: true
      dedup_cells: true           # collapse identical consecutive cells in a row
      strip_empty_cells: true     # remove empty cells from table rows
      extract_metadata_rows: 5    # first N rows: try to pull key-value pairs into metadata
      extract_images: true        # pull embedded images from xlsx zip (xl/media/)
      ensure_page_images: true    # LibreOffice → PDF → page screenshots when Docling has none
      max_page_images: null       # no per-format cap; defers to parsing.vision.max_pages (default 50).
                                  # Earlier 10 was overly defensive — single-sheet 方眼紙 / DB design
                                  # / process-flow xlsx routinely renders to 20-160 PDF pages via
                                  # LibreOffice, and the global parsing.vision.max_pages already
                                  # acts as the cost ceiling. Set an int here only if a specific
                                  # xlsx workload needs a tighter local cap.
      max_image_pixels: 4000000   # single image pixel cap (≈2000x2000). Larger images are scaled down.

    # Filler-placeholder row dropping (openpyxl renderer only).
    # Real Japanese spec / JD sheets routinely pad a small data table out to a
    # nominal max_row of 1M+ by filling the unused region with a placeholder
    # token like "--". openpyxl reports those as real string values (not None),
    # so the empty-row pruning above — which only knows None / "" — can't drop
    # them, and they flood the Markdown (chunks explode, tokens burn, the real
    # rows drown). This drops a row ONLY when EVERY non-empty cell in it is a
    # placeholder, so a meaningful single "--" inside a mixed row ("no value for
    # this field") is always preserved. Image-anchored rows are never dropped.
    placeholder_rows:
      enabled: true
      # Matched case-insensitively after strip(). A bare "-" is intentionally
      # NOT included by default — it collides with legitimate single-dash data;
      # add it here if your sheets use it as filler. Visually-similar dashes are
      # distinct codepoints (- U+002D / – U+2013 / — U+2014 / ― U+2015 /
      # − U+2212), so list whichever your files actually use.
      values: ["--", "―", "N/A", "なし"]

    # Optional per-format Vision override. See parsing.pdf.vision for usage.
    vision:
      # max_response_tokens: 32768
      # image_dpi: 200
      # model: { provider: ..., model: ... }
      # xlsx-only: Vision SUPPLEMENTS the openpyxl table render — it ADDS visual
      # content (embedded charts/pictures/stamps/handwriting) but NEVER
      # re-transcribes the table rows openpyxl already extracted. Removes the
      # xlsx Vision↔openpyxl duplication at the source (measured: foox 74% /
      # moonmile 92% per-section re-transcription → eliminated). SAFE for body
      # text: the table text lives in the openpyxl render, which supplement
      # never touches, so it cannot be dropped. PDF/PPT deliberately do NOT set
      # this (global supplement_only=false) — Docling fragments their 方眼紙
      # tables, so they need full whole-page transcription to recover the body.
      supplement_only: true
      # Sheet-level triage: a sheet whose raw OOXML carries ZERO drawing
      # elements (pictures, shapes, connectors, chart frames) and no OLE
      # objects has nothing the page render could add — openpyxl already
      # extracted its cells — so its pages skip Vision. Counted straight
      # from the zip's drawing XML, NOT openpyxl objects (those silently
      # drop shapes/EMF, which would wrongly skip shape-drawn flow
      # diagrams). All-empty workbook → the LibreOffice render is skipped
      # too. Partially-visual workbook → only pages of empty sheets are
      # skipped, and only when the sheet→page map covers every visible
      # sheet; pages with hook-injected structured data are always sent.
      # Oracle-tested: skipped sheets' supplements were empty or pure
      # template furniture. false = always send everything.
      sheet_triage: true
      # Ground-truth slicing, BOTH Vision paths: each batched call (and
      # each per-page call when the file doesn't qualify for batching)
      # gets only ITS sheets' text as the "already captured, don't
      # re-transcribe" reference instead of the whole workbook (which
      # repeated the full markdown once per call — measured 5×192k chars
      # batched on a 159-page workbook, and 16×~19k tokens per-page on a
      # 28-sheet workbook; the dominant input-token share either way).
      # Attribution reuses the sheet_triage anchored-range rule; ANY doubt
      # (unmapped neighbour sheet, page outside anchors, section/sheet
      # count mismatch) sends the full markdown for that call. A wrong
      # slice would not lose data — the prompt treats mismatched ground
      # truth as a failed extraction and re-transcribes in full (the
      # saving inverts, the content stays) — but the conservative
      # fallbacks keep even that from happening. Formats without a
      # sheet→page map (docx) detect as unsliceable and keep the full
      # markdown. false = always send the full markdown per call.
      ground_truth_slice: true

    # Embedded-image full-res Vision (same mechanism + keys as
    # parsing.docx.image_extraction). The denoising.extract_images step above
    # already saves every xl/media/* picture to assets/ and the openpyxl
    # renderer cell-anchors a `<!-- image: <file> -->` marker for each; this
    # additionally sends pictures above min_dimension to Vision at ORIGINAL
    # resolution — fixing screenshots pasted into sheets (画面レイアウト etc.)
    # whose small text blurs in the LibreOffice page render. The transcription
    # lands after the table holding the marker (inserting mid-table would
    # split it). EMF/WMF are skipped naturally: PIL can't read their size, and
    # Vision can't read EMF anyway — their markers and assets remain.
    image_extraction:
      enabled: true
      min_dimension: 200         # px; smaller on BOTH sides (cell icons) → not sent
      vision_enrich: true        # false = extract + mark only, zero extra API cost
      max_images_vision: null    # null = read EVERY qualifying figure (no silent
                                 # truncation — a workbook with many pasted
                                 # screenshots/diagrams legitimately needs them all;
                                 # dropping some past N would be info loss disguised
                                 # as cost defence). Cost is surfaced up-front by the
                                 # safety pre-flight (inspect counts xl/media/ images,
                                 # estimate_file_cost_usd prices them), not hidden by
                                 # a cap. Set an int only for a specific tight job.

# =============================================================================
# Phase 2: Output Structure
# =============================================================================
output:
  dir: "./knowledge"
  sources_dir: "sources"
  assets_dir: "assets"
  index_file: "index.json"
  include_bounding_boxes: true  # Extract per-element coordinates from Docling

  # Docling+Vision dedup — choose which view to keep when a page has both.
  #
  # When Vision enrichment runs on a page in FULL mode (PDF / PPT), the pipeline
  # produces two views of that page in the markdown: Docling's text/table
  # extraction, then a `<!-- vision-enriched ... -->` marker, then Vision's
  # whole-page transcription. For clean text/contract pages Vision is the better,
  # more complete view (it recovers handwritten signatures, filled-in blanks,
  # structured fields Docling misses) — so the Docling half is redundant.
  #
  # vision_keep selects which half to keep, by SPLITTING ON THE MARKER (never by
  # length-ratio guessing — the old approach silently overwrote the wrong side):
  #   both    = keep both halves (zero content loss, = legacy behaviour)
  #   vision  = drop the Docling half, keep Vision (de-dups full-mode pages;
  #             Vision is usually the superset for text PDF/PPT)
  #   docling = drop the Vision half, keep Docling
  #   auto    = decide PER PAGE: keep Docling on pages where Vision is riddled
  #             with [unreadable]/[?] (Vision didn't see it well); keep Vision
  #             where Docling's table looks collapsed; otherwise keep Vision
  #             (same bias as `vision`, so auto never does worse). Only whole-
  #             page markers participate; image= supplements stay untouched.
  #
  # SAFETY — only applied to FULL-mode, pagebreak-aligned sections:
  #   - xlsx (supplement mode): Vision only ADDS visuals; the table body lives in
  #     the Docling/openpyxl half. Dropping Docling there would delete the table
  #     body. → vision_keep is IGNORED for supplement-mode formats (stays both).
  #   - docx (Mode B, no pagebreaks): Vision is appended at the document end and
  #     does NOT align page-by-page with the Docling text — the two halves are
  #     different content, not a superset pair. → IGNORED (stays both).
  # So `vision: vision` safely de-dups PDF/PPT while auto-protecting xlsx/docx.
  vision_keep: vision           # both | vision | docling | auto
                                # DEFAULT = vision: on a full-mode page (PDF/PPT)
                                # keep only the Vision half (the superset view);
                                # drop the redundant Docling half. xlsx/docx are
                                # auto-protected (kept as both) by the guards above.

  # Superset guard for vision_keep=vision/auto→vision: before dropping a
  # section's Docling half, check it line-by-line (NFKC + decoration-stripped)
  # against the Vision half. If any Docling line is ABSENT from Vision, that
  # section keeps BOTH halves and logs a warning — dropping would lose content.
  # Real case this catches: Docling's PPTX serializer drifts slide boundaries,
  # parking a divider slide's title or the closing slide's text inside a
  # neighbouring section whose Vision render never saw it (triage-skipped pages
  # have no Vision fallback → the text would vanish entirely).
  # This knob is the minimum normalized line length that counts as content —
  # shorter lines (page numbers, footer furniture) never block the dedup.
  vision_keep_min_unique_chars: 4

  markdown:
    include_metadata_header: true  # YAML frontmatter in each file
    image_refs: "relative"         # relative | absolute | inline_base64
    max_file_size_mb: 10           # split very large documents

    # Frontmatter field whitelist + order. Fields appear in the generated
    # frontmatter only if (a) they're in this list AND (b) the hook / parser
    # actually wrote them to parse_result.metadata. Unknown fields in metadata
    # are NOT auto-exported — this protects frontmatter from leaking internal
    # state. Hooks that need a new field should add its name here AND write
    # the value to parse_result.metadata.
    frontmatter_fields:
      # Core identity
      - type            # semantic kind (Document/Spreadsheet/Transcript…),
                        #   OKF-aligned; see output.derived_metadata.type
      - format
      - title
      - language
      - pages
      # Source URL for URL-resolved inputs (OKF `resource`: canonical URI
      # of the underlying asset). Absent for ordinary local files.
      - resource
      # Retrieval-optimized one-sentence summary (OKF `description`) —
      # written post-run by description enrichment when
      # output.derived_metadata.description.enabled is true.
      - description
      # Docling origin (promoted by file_metadata hook)
      - mimetype
      - binary_hash
      # Exiftool enrichment (populated when metadata.exiftool.enabled)
      - author
      - created_at
      # Derived metadata — see output.derived_metadata below.
      # Always-on (best-effort): created falls back to filesystem mtime
      # when no embedded date is available; aliases / tags are produced
      # from in-memory data already in metadata. Each one is an
      # independent toggle under output.derived_metadata.* if a deployment
      # wants to opt out.
      - created
      - created_source
      - aliases
      - tags
      - related          # Jaccard-similar files (populated when
                         #   output.derived_metadata.related.enabled)

  # Derived metadata — fields synthesised from data already extracted by
  # parsers / hooks. Independent of any external tool. Disabling these
  # only suppresses the field; the underlying source data is unaffected.
  derived_metadata:
    # Semantic concept type (Document / Spreadsheet / Transcript / …) derived
    # from the file format. Distinct from `format` (the extension): agents use
    # `type` for routing/filtering, and it is the Open Knowledge Format (OKF)
    # required field. Mapping is fully overridable — add/replace entries to fit
    # your domain (e.g. map "xlsx" → "Spec" for spec-sheet workflows). A format
    # absent from the mapping falls back to `fallback` (a real generic type,
    # not an error). Leave mapping empty/unset to use the built-in defaults in
    # hooks/derive_type.py.
    type:
      enabled: true
      fallback: "Document"        # type for formats not in the mapping
      mapping: {}                 # {} → use built-in defaults; populate to override.
                                  #   e.g.  mapping: {pdf: Document, xlsx: Spec, m4a: Transcript}
    created:
      enabled: true               # write `created` + `created_source`
                                  # (false → leave both absent)
    aliases:
      enabled: true
      max_count: 5                # cap on emitted aliases per file
      # Garbage candidates — match (case-insensitive) and the candidate
      # is dropped entirely. Used for boilerplate titles like "Untitled"
      # or "Microsoft Word - Document1" that pollute search.
      garbage_patterns:
        - "^untitled\\d*$"
        - "^document\\d*$"
        - "^microsoft word - "
        - "^slide\\d+$"
        - "^\\s*$"
        # 64-char hex — sha256 / md5 used as internal cache filenames
        # (e.g. pipeline.py Phase 0.5 .xls→.xlsx cache stem). Real file
        # names never look like this; suppresses cache-stem leakage into
        # aliases when downstream hooks read file_path.stem.
        - "^[0-9a-f]{64}$"
      # Temp filename markers — match → candidate is DEMOTED (kept only
      # when it would otherwise leave the alias list empty / undersized).
      # These are version markers and copy artefacts that real documents
      # may have, so we don't drop them outright.
      temp_filename_patterns:
        - "\\bv\\d+\\b"
        - "\\bfinal\\b"
        - "_copy$"
        - "\\(\\d+\\)$"
        - "^tmp[_\\-]"
        - "副本"
        - "复件"
    tags:
      enabled: true
      include_format: true        # add format/<f> tag (e.g. format/pdf)
      include_language: true      # add lang/<l> tag (e.g. lang/ja)
      # Stage 2: after the knowledge_map is built, append kw/<word> tags
      # using the corpus-wide TF-IDF filtered keyword index. Set false
      # to keep tags as just format/lang.
      enrich_from_knowledge_map: true
      max_keyword_tags: 5         # per-file cap on kw/<word> additions
    # Related-links: add a `related` frontmatter list of the top-N files most
    # similar to each file, by Jaccard similarity over their (already
    # TF-IDF-filtered) keyword sets. Zero-cost cross-file association — the
    # cheap, no-LLM alternative to the GraphRAG layer. Links use OKF-compatible
    # bundle-relative form. This is a SUGGESTION field (a lead, not an answer);
    # an occasional miss or extra is harmless.
    #
    # Lexical, not semantic — and the limit is bigger than just synonyms:
    # two files on the SAME topic that happen to use DIFFERENT words won't be
    # linked at all. (Verified: two government specs — one about a learning
    # system's features, one about Excel-ifying spec layouts — share almost no
    # keywords and score ~0, even with body text added.) Lexical Jaccard can
    # only catch files with overlapping wording (e.g. the same document set);
    # for true topic/semantic association use the GraphRAG layer instead.
    related:
      enabled: false              # default OFF — opt-in (backward compatible)
      max_links: 3                # per-file cap on related links
      min_similarity: 0.15        # Jaccard threshold (0~1); below → no link
                                  #   (don't manufacture weak associations)
    # Description: one retrieval-optimized frontmatter sentence per file
    # (OKF-recommended `description` field). Costs an LLM call per batch of
    # files (model: models.chunking_assist), hence default OFF — same
    # precedent as `related`: zero-cost derived fields default on, fields
    # that cost an API call default off. Files that already carry a
    # description are skipped (idempotent across incremental runs).
    description:
      enabled: false              # default OFF — opt-in (costs an LLM call)
      batch_size: 20              # files per LLM call
      algorithm: jaccard          # only 'jaccard' implemented; seam for future
                                  #   metrics (overlap / cosine) without breaking

# =============================================================================
# Phase 3: Chunking
# =============================================================================
chunking:
  enabled: true
  strategy: "auto"            # auto | heading | recursive | slide | sheet | timestamp | whole

  max_tokens: 512
  min_tokens: 100
  # Token overlap between consecutive chunks produced by RecursiveChunker.
  # NOTE — overlap applies ONLY inside RecursiveChunker (i.e. when a heading
  # section exceeds max_tokens and recursive is invoked to sub-divide it).
  # HeadingChunker's section boundaries, SlideChunker's slide boundaries,
  # SheetChunker's table boundaries, and TimestampChunker's time segments
  # are treated as hard semantic breaks — they do NOT receive overlap.
  # TableSplitter achieves the same goal differently (header repetition).
  # Keep the default at 50 (conservative, matches LangChain / Chonkie
  # defaults). 2026 benchmarks (Vecta, SPLADE+Mistral-8B on NQ) report
  # overlap contributes <1% recall for recursive strategies — most users
  # can safely set this to 0 to shrink chunks.jsonl by ~10%.
  overlap_tokens: 50

  heading:
    levels: [1, 2, 3]
    fallback: "recursive"
    merge_small_sections: true  # Merge adjacent sections below min_tokens into one chunk
                                # false = every heading boundary is a hard chunk boundary (legacy)

    # How to handle content that appears BEFORE the first heading in a
    # document (e.g. page-header stray text Docling extracts from PDFs).
    #   attach_to_first — glue it to the first real section (default, avoids
    #                     tiny orphan chunks like "西暦" at chunk[0])
    #   standalone      — emit as its own chunk with empty title_path
    #   drop            — discard silently (useful for aggressive denoising)
    prelude_policy: "attach_to_first"

    # How to handle a heading line with no body (e.g. "## Chapter 2" with the
    # next line being another heading or empty).
    #   merge_forward — attach the heading to the NEXT section that has body
    #                   content, preserving its deepest title_path (default)
    #   keep          — emit the lone heading as its own chunk (legacy)
    orphan_heading_policy: "merge_forward"

    # Which title_path to keep when multiple sections merge into one chunk.
    #   deepest   — the most-granular path (most " > " segments) wins (default)
    #   first     — the first non-empty title_path
    #   join_all  — all paths joined by " | " (legacy behaviour)
    title_path_strategy: "deepest"

    # Pseudo-heading filter. Docling mislabels list items / figure captions /
    # whole sentences as ## headings when a PDF renders them in a larger font;
    # those bogus headings poison title_path (measured: 39% of headings in a
    # real spec PDF were noise). When enabled, a #-line that doesn't look like a
    # real heading is demoted to body text — content is kept, it just doesn't
    # open a new section or enter title_path.
    #
    # Two language/format-agnostic rules (verified on JA/EN/ZH); a real heading
    # is a short label, so it's rejected only when it (1) ends in sentence
    # punctuation or (2) starts with a bullet / "N)"-style list marker. There is
    # deliberately NO length rule — char thresholds mis-drop English headings
    # (words + spaces run long). Dotted decimals ("2.1.") are NOT list markers,
    # so real numbered sections survive.
    filter_pseudo_headings:
      enabled: true
      # Trailing punctuation that marks a sentence (→ not a heading).
      sentence_endings: ["。", "．", ".", "、", "！", "!", "？", "?", ";", "；"]
      # NOTE: the bullet / enumeration prefixes are a fixed regex in
      # heading.py (CJK + ASCII bullets, circled numbers, "N)"/"a)") — they are
      # structural Markdown/Unicode facts, not a per-project knob, so they live
      # in code rather than here. Flip `enabled: false` to honour every #-line.

  auto:
    min_headings: 3
    max_heading_gap_levels: 2
    min_section_tokens: 100
    max_section_tokens: 2000
    section_size_pass_ratio: 0.5  # fraction of sections that should be in range
    prefer_heading_threshold: 2   # structure score >= 2 → heading strategy

    # Format-specific strategy mapping (override per format)
    format_strategies:
      pptx: "slide"
      xlsx: "sheet"
      csv: "sheet"
      image: "whole"
      audio: "timestamp"
      video: "timestamp"
      default: "scoring"          # all others → structure scoring

    # Extensions treated as "image" format
    image_formats: ["png", "jpg", "jpeg", "tiff", "bmp", "webp", "gif"]

    # Extensions treated as "audio" / "video" format (for auto strategy)
    audio_formats: ["mp3", "wav", "m4a", "flac", "aac", "ogg", "wma", "opus"]
    video_formats: ["mp4", "avi", "mkv", "webm", "mov", "wmv", "flv", "ts", "m4v"]

  # Protection rules (applied across all strategies)
  protection:
    tables: true              # don't split Markdown tables
    code_blocks: true         # don't split ``` blocks
    lists: true               # keep lists together when possible
    quotes: true              # keep > blocks together
    # How much protected blocks may exceed max_tokens.
    # Single number = uniform for all types (legacy).
    # Dict = per-type control (table, list, code_block, quote, default).
    allowed_overflow:
      table: 2.0              # tables are hard to split — allow more
      code_block: 3.0         # code blocks should stay intact
      list: 1.5               # lists can be split at item boundaries if too large
      quote: 1.5
      default: 1.5            # fallback for any unspecified type

    # What to do when a protected block EXCEEDS its allowed_overflow budget.
    # Per-block-type so different content kinds get the right trade-off.
    #   bypass          — emit the oversized block as a single chunk (legacy).
    #                     OK for code (splitting mid-function breaks syntax).
    #   row_split       — tables only: split at data-row boundaries, repeat
    #                     header in every sub-chunk (2026 industry standard,
    #                     see Chonkie TableChunker / Ragie table chunking).
    #                     Fixes Docling's merged-cell expansion producing
    #                     multi-kilo-token tables.
    #   item_split      — lists only: split at list-item boundaries, and if
    #                     one item alone is still too large, hand it back to
    #                     RecursiveChunker with list protection disabled.
    #   warn_and_bypass — same as bypass + logs a warning so oversized blocks
    #                     stay discoverable for tuning.
    on_overflow:
      table: "row_split"
      code_block: "bypass"
      list: "item_split"
      quote: "bypass"
      default: "bypass"

    # Parameters for row_split (consulted only when on_overflow = row_split).
    table_split:
      keep_header_in_every_chunk: true   # every sub-chunk is self-describing
      max_rows_per_chunk: null           # null = only token budget applies;
                                         # set an integer to cap row count
                                         # (useful for DB-dump-style tables)

  ai_assist:
    enabled: true
    trigger: "oversized"      # oversized | anomaly | always | never
    oversized_multiplier: 2   # chunk > max_tokens * 2 triggers AI

  enrichment:
    path_injection: true      # prepend file path + heading path (free, always do)
    contextual_summary: false # LLM summary per chunk (expensive, opt-in)

  output_file: "chunks.jsonl"

# =============================================================================
# Performance
# =============================================================================
performance:
  parallel_files: 16          # Worker count shared by Vision per-page calls
                              # and ASR per-segment transcription (the
                              # WITHIN-file pools). File-level overlap is a
                              # separate knob: file_concurrency below.
                              # 16 (raised from 4): Vision is I/O-bound (waiting
                              # on the LLM), so higher concurrency cuts wall-clock
                              # a lot — measured flash-lite at 32 ran 300 pages in
                              # 87s with no rate-limiting. 16 is a balanced default
                              # that most API tiers tolerate; lower it (e.g. 4-8)
                              # on a shared / tier-1 key that hits RPM limits,
                              # raise toward 32 on a high-RPM tier.

  # File-level pipeline overlap. 1 (default) = process files sequentially —
  # behaviour identical to before this knob existed. 2-3 = file B parses
  # while file A waits on Vision I/O. Parsing itself NEVER runs concurrently
  # regardless of this value (probe-verified: the Docling models load once
  # per parser (~1.9GB RSS), and concurrent parses amplify the intermittent
  # docling-parse Windows std::bad_alloc — a global parse lock serializes
  # them); the win comes from overlapping parse with the Vision wait, which
  # dominates wall time. Outputs are aggregated in input order on the main
  # thread, so index.json / chunks.jsonl are ordered exactly like a
  # sequential run. Progress events from overlapping files interleave —
  # leave this at 1 for UIs that assume one-file-at-a-time display.
  file_concurrency: 1

  # Global cap on TOTAL in-flight Vision calls across all files. null =
  # follow parallel_files (single-file behaviour unchanged). Without this,
  # file_concurrency × parallel_files calls would hit the provider at once
  # and trip rate limits. Raise together with provider quota.
  vision_global_concurrency: null

# =============================================================================
# Error Handling
# =============================================================================
error_handling:
  on_parse_failure: "skip"    # skip | fail
  on_vision_failure: "skip"   # chart description fails → skip (text preserved)
  on_chunk_failure: "fallback" # chunk fails → fallback to recursive
  max_retries: 2
  report_file: "errors.json"

# =============================================================================
# External binaries
# =============================================================================
# Explicit paths for external command-line tools DocIngest can use when
# present (LibreOffice for office→PDF rendering, ExifTool for metadata,
# ffmpeg for audio preprocessing). Leave as null to auto-discover via the
# binary finder, which probes (in order):
#
#   1. this config key (highest priority; misconfigured paths fail loud)
#   2. dedicated env vars (SOFFICE_PATH / EXIFTOOL_PATH / FFMPEG_PATH)
#   3. shutil.which() — PATH lookup
#   4. platform-specific standard install locations (Program Files on
#      Windows, /Applications on macOS, /usr/bin on Linux, …)
#
# Only set these when auto-discovery fails (unusual install drive,
# portable copies, multi-version systems).
binaries:
  soffice:
    path: null           # LibreOffice — e.g. "D:/tools/libreoffice/soffice.exe"
  exiftool:
    path: null           # ExifTool — e.g. "C:/Program Files/exiftool/exiftool.exe"
  ffmpeg:
    path: null           # ffmpeg — reserved for future audio parser

# =============================================================================
# Cache (AI call result caching — Vision/LLM responses by content hash)
# =============================================================================
cache:
  enabled: true
  dir: ".docingest_cache"

# =============================================================================
# File metadata enrichment (file_metadata hook)
# =============================================================================
# Two data sources surface into parse_result.metadata and then into the
# sources/*.md frontmatter:
#
#   1. Docling origin (always on, zero cost):
#      mimetype + binary_hash are lifted from Docling's DoclingDocument.origin
#      into top-level frontmatter keys. This is pure promotion — no external
#      tools, no extra I/O.
#
#   2. ExifTool (opt-in, requires system-level exiftool executable):
#      Reads PDF Author / CreateDate, image EXIF (GPS, camera, keywords),
#      audio ID3 tags, etc. Fields that Docling does NOT expose. Requires:
#        - `exiftool` >= 12.24 (CVE-2021-22204 fix) on PATH, OR
#          metadata.exiftool.path pointing at an explicit location
#        - optionally `pyexiftool` Python package for stay_open mode
#          (pip install pyexiftool) — falls back to subprocess otherwise
#      When exiftool is unavailable, the hook silently skips this part
#      and frontmatter simply lacks the exiftool-derived fields.
metadata:
  exiftool:
    enabled: false                # opt-in: flip to true when exiftool is installed
    path: null                    # null = auto-discover via shutil.which
    # Per-format field whitelists (merged with Exiftool canonical names).
    # Fields outside this list are dropped from the nested `exif:` frontmatter
    # block to keep output focused. Family is picked by file extension:
    #   image: png/jpg/jpeg/gif/tiff/bmp/webp/heic
    #   pdf:   pdf
    #   audio: wav/mp3/m4a/flac/ogg/aac
    #   office: docx/doc/pptx/ppt/xlsx/xls
    fields:
      image: [ImageSize, Title, Caption, Description, Keywords,
              Artist, Author, DateTimeOriginal, CreateDate, GPSPosition]
      pdf:   [Title, Author, Subject, Keywords, CreateDate, ModifyDate,
              Producer, Creator]
      audio: [Title, Artist, Album, Genre, Track, DateTimeOriginal,
              CreateDate, Duration]
      office: [Title, Author, Subject, Keywords, Company, CreateDate,
               ModifyDate, LastModifiedBy]

# =============================================================================
# Quality report (Vision uncertainty marker scan)
# =============================================================================
# Scans sources/*.md for [?] (partial reads) and [unreadable] markers that
# the Vision prompt uses when it cannot fully transcribe content. Provides
# a quick health check and identifies files that need manual review or
# higher DPI re-processing.
quality_report:
  enabled: true                       # scan after pipeline completes
  output_file: "quality_report.json"  # full report path (relative to output.dir)
  max_samples: 50                     # per-file cap on the `samples` list (the
                                      # example marker lines shown for a quick
                                      # eyeball). Display only — total_questions
                                      # / total_unreadable are always the exact
                                      # full counts, independent of this. A
                                      # scanned page rarely has more than a few
                                      # markers, so 50 shows everything for any
                                      # normal doc while capping a pathological
                                      # scan from bloating the JSON with lines
                                      # already present in sources/*.md. Set 0
                                      # to list every marker line (no cap).

# =============================================================================
# Run log (append-only pipeline timeline)
# =============================================================================
# Unlike errors.json / quality_report.json (per-run snapshots overwritten on
# each run), log.md is the knowledge base's TIMELINE across runs — one section
# appended per `docingest run` invocation, recording what was added, updated,
# or failed, and when.
#
# The log is grep-friendly: every section header starts with
# "## [<ISO timestamp>] run ...", so e.g.
#   grep "^## \[" log.md | tail -5
# yields the last five runs regardless of body length.
#
# Cached files stay silent in the body (only counted in the summary) so a
# 100-file knowledge base with 1 new file produces 1 body line, not 100.
# No-change runs still write a header so "did the pipeline run on <date>?"
# is answerable from the log alone.
#
# Toggling enabled does NOT invalidate the content cache — run_log is
# metadata about runs, not about file contents.
run_log:
  enabled: true           # master toggle
  output_file: "log.md"   # relative to output.dir

# =============================================================================
# Safety — pre-run budget check (Phase 0)
# =============================================================================
# Runs BEFORE any parsing / LLM call. Flags files and per-run totals that
# exceed configured thresholds and surfaces a structured violation report.
#
# Why not just file size (MB)?
#   Disk size is a poor proxy for cost. A 100 MB PPTX with 20 slides is
#   cheaper than a 5 MB PDF with 200 dense pages. Real cost drivers are:
#     pages          → Vision API calls (PDF pages, PPTX slides)
#     chars_est      → output markdown / token bulk (sampled for PDF)
#     rows           → xlsx processing time
#     duration_sec   → ASR cost (audio / video)
#     est_cost_usd   → rough dollar estimate based on Vision model price
#     size_mb        → last-resort guard for formats we can't introspect
#
# Modes:
#   off    — skip Phase 0 entirely (legacy behaviour).
#   warn   — log violations, run anyway.
#   strict — (default) refuse to run; caller must raise a threshold or
#            opt in:
#              CLI:        docingest run ... --yes
#              Python lib: docingest.ingest(..., acknowledge_large=True)
#              MCP agent:  inspect first → surface violations to human →
#                          retry with acknowledge_large=True
#
# Why strict default: a single rogue 1 GB CSV / 5 h video silently chews
# through API budget or OOMs the process in warn mode. Strict makes the
# operator look at the cost report before paying it; the day-to-day
# small-file user is unaffected because thresholds below are sized to
# real-world docs, not toys.
#
# MCP agents receive safety.violations in the run result, so they can
# inspect them and retry with acknowledge_large=true. This mirrors MCP's
# own elicitation/create pattern (confirm-on-expensive).
#
# Thresholds below are sized for real-world business documents (multi-
# hundred-page reports, multi-MB workbooks). Tighten them if your
# workload is tighter; relax further if you routinely process large
# inputs (and consider mode: warn as the safer relaxation).
safety:
  enabled: true
  mode: "strict"                # off | warn | strict

  # Per-file thresholds. A single file exceeding ANY of these is flagged.
  # Set a field to null to disable that specific dimension.
  # Sized so a typical business document (long contract, dense report,
  # multi-MB workbook) doesn't trip strict; outliers (1 GB CSV, 2 h
  # video, 500-page scan) do.
  per_file:
    max_pages: 100              # PDF pages / PPTX slides / DOCX est-pages
                                # (Anthropic Vision's own default cap)
    max_chars_est: 500000       # ≈ 200 pages of dense text
    max_rows: 50000             # xlsx / csv total rows
    max_duration_sec: 1800      # 30 min — audio / video
    max_size_mb: 100            # Disk-size fallback
    max_est_cost_usd: 2.0       # Dollar budget per file

  # Per-run thresholds — protect against "many small files adding up".
  per_run:
    max_total_pages: 500
    max_total_files: 100
    max_total_est_cost_usd: 10.0

  # Text-length estimation tuning for PDF.
  # PyMuPDF's get_text() is fast but full scan of a 1000-page PDF still
  # costs ~10 s. Sampling N pages and extrapolating keeps inspect <100 ms.
  # Set enabled: false to force exact counts (slower, more precise).
  sampling:
    enabled: true
    pdf_sample_pages: 3

  # Per-Vision-call token estimate — the PRIMARY cost model. est_cost_usd =
  # calls × these tokens priced via litellm's bundled price table for the
  # configured vision model (switching models reprices automatically).
  # Calibrated on a real run (92-page Japanese thesis docx, 2026-06-12,
  # AFTER ground-truth slicing landed): 92 cache-cold calls averaged 2.9K
  # input / 3.1K output tokens each — input is the page image plus the
  # SLICED per-page ground truth (the pre-slicing whole-book context that
  # once pushed this to 42K/call is gone; see parsing.<fmt>.vision.
  # ground_truth_slice). 8000 keeps a ~2.7x margin as the CACHE-COLD UPPER
  # BOUND: slicing falls back to the full markdown on attribution doubt,
  # re-runs hit the content-hash cache and cost less, and provider-side
  # prompt-cache discounts are ignored (the safety gate must over- not
  # under-estimate).
  est_tokens_per_vision_call:
    input: 8000
    output: 3000

  # LEGACY FALLBACK per-call price table in USD — used only when litellm's
  # price table doesn't know the configured model (private deployment, very
  # new release). Not a live feed — update after provider pricing changes.
  # Unknown models fall back to "_default". Prefix match works too, so
  # "gemini-3-flash-preview" hits the "gemini-3-flash" entry.
  # NOTE: these per-call figures predate the token model above and run LOW
  # for dense documents (calibration doc measured ~$0.03/call vs 0.0002
  # here); prefer fixing the litellm model name so the primary path applies.
  vision_price_per_call:
    gemini-3-flash-preview: 0.0002
    gemini-3-flash: 0.0002
    gemini-3.1-flash-lite-preview: 0.0001  # ~half flash's token price ($0.25/1M in
    gemini-3.1-flash-lite: 0.0001          # vs $0.50). Cheaper, but NOT the default —
                                           # measured weaker on table structure +
                                           # under-marks [unreadable] (anti-hallucination
                                           # regression) and was SLOWER on the preview
                                           # endpoint. Opt in via models.vision.primary.
    gemini-3.1-pro-preview: 0.002       # current Gemini 3 Pro (3-pro-preview deprecated 2026-03-09)
    gemini-3-pro-preview: 0.002         # kept for cache hits on older runs
    gemini-3-pro: 0.002
    gpt-5.5: 0.012                      # estimated per-call ($5/1M in + ~$30/1M out, ~1k image tokens typical)
    gpt-5.4-mini: 0.005
    gpt-4o: 0.008
    gpt-4o-mini: 0.002
    claude-sonnet: 0.006
    _default: 0.005

  # Per-token price (USD per 1M input tokens) for NATIVE video understanding,
  # which bills per token (not per call). est_cost_usd for a video =
  # duration_sec × (258×fps + 32) tok/s × this / 1e6. Default = Gemini 3 Flash
  # input price ($0.50/1M, video billed same as text). Update on price change.
  # Frame-sampling fallback (native_video off) uses vision_price_per_call above.
  video_token_price_per_million: 0.50

# =============================================================================
# Incremental processing (content-addressed pipeline output cache)
# =============================================================================
# Skips re-processing files whose content hasn't changed since last run.
# Cache key = md5(head + tail bytes) + file_size (content-based, NOT path-based).
# Invalidates automatically when:
#   - File content changes
#   - Output config changes (relevant subset only)
#   - Output files (sources/, assets/) are manually deleted
#   - chunk_ids are missing from chunks.jsonl
# Cache stored at: {output.dir}/{incremental.cache_dir}/*.meta.json
incremental:
  enabled: true                   # master toggle
  force: false                    # true → ignore cache, full rebuild
  cache_dir: ".cache"             # relative to output.dir

# =============================================================================
# Refine (optional: AI-powered Markdown cleanup for human readability)
# =============================================================================
# NOT part of the main pipeline — invoked separately via `docingest refine`.
# Produces readable/ versions of sources/ files without modifying originals.
refine:
  output_dir: "readable"          # output subdirectory inside knowledge/
  model: "chunking_assist"        # reuse models.chunking_assist config
  max_input_tokens: 50000         # files larger than this are auto-split into
                                  # heading-aligned pieces, refined in parallel,
                                  # then stitched back (see split_target_tokens).
                                  # Previously these were skipped outright.
  split_target_tokens: 8000       # when splitting, target tokens per piece.
                                  # Measured sweet spot: at ~8k–10k/piece a flash
                                  # model keeps tables AS tables (89% table / 98%
                                  # fact fidelity on a 100k-token doc); bigger
                                  # pieces let the model rewrite tables into prose.
                                  # Cuts fall only on heading boundaries and never
                                  # inside a protected block (table/code), so a
                                  # table is never split across pieces.
  split_parallel: true            # refine pieces concurrently (workers =
                                  # performance.parallel_files). false → serial
                                  # (lower peak API concurrency on shared keys).
  cost_check:                     # pre-flight spend gate (refine calls a paid
                                  # LLM per piece; a big file fans out into many
                                  # calls). Same off/warn/strict idea as
                                  # safety.mode, but scoped to refine.
    mode: "warn"                  # off → never check; warn (default) → log a
                                  # notice over budget then run (minimal
                                  # intrusion, existing callers unaffected);
                                  # strict → BLOCK over budget until the user
                                  # acknowledges (CLI --yes / acknowledge=True).
    max_est_cost_usd: 0.50        # trip when the whole refine run is estimated
                                  # to cost more than this. null = no cost gate.
    max_pieces: 50                # trip when total pieces across all files
                                  # exceeds this (fan-out guard). null = off.
  max_output_tokens: 65536        # LLM response cap (raised to provider ceiling —
                                  # 8000 was a 2024 leftover that truncated long
                                  # refines silently; refine.py already retries
                                  # with retry_max_tokens but the first attempt
                                  # should not waste a call on a too-small budget)
  default_skill: "refine_default" # SKILL file name (without .SKILL.md)
  skills_dir: "skills"            # directory containing .SKILL.md files

# =============================================================================
# Knowledge Map (search guide for Agents)
# =============================================================================
knowledge_map:
  enabled: true
  ai_summary: true              # true: AI generates summary + search guide (1 API call)
                                # false: Stage 1 only (zero cost, structure + keywords only)
  # Inject a short two-phase search-protocol block into knowledge_search.SKILL.md
  # (RAG → Agentic Search, synonym expansion, "Grep miss ≠ not written" guard).
  # Language follows the knowledge base's dominant language (ja / zh / en;
  # others fall back to en). The wording is hard-coded — this switch only
  # turns the block on/off. Turn off if you have your own Agent guidance.
  search_protocol: true
  output_file: "knowledge_map.yaml"
  keywords:
    # --- SudachiPy backend (used when `pip install sudachipy sudachidict_core`) ---
    pos_keep: ["名詞"]            # POS major categories to keep (Japanese morphology)
    sudachi_mode: "C"             # A=finest, B=middle, C=coarsest (compound nouns)
    # --- Regex fallback (used when SudachiPy is not installed) ---
    latin_min_len: 3              # Minimum Latin word length (filters "No", "of", etc.)
    cjk_min_len: 3                # Minimum raw CJK run length before strip
    cjk_strip_patterns:           # Regex patterns stripped from CJK run head/tail
      - "^[のはをがにでとも]+"
      - "に関する$"
      - "について$"
      - "における$"
      - "および$"
    cjk_min_after_strip: 2        # Minimum CJK length after stripping
    # --- Common to both backends ---
    extra_stop_words:             # Words to always exclude from keywords
      - "group"                   # Docling internal group name
      - "list"                    # Docling internal group name
      - "slide"                   # Docling internal group name
      - "transcript"              # media parser's fixed "## Transcript" heading —
                                  # a placeholder, not content (matched lowercase)
      # Common English function words. Headings rarely contain these, but the
      # body-fallback path (structure-less docs) extracts running prose where
      # they dominate — without this list a fallback file's top keywords are
      # "the / and / with". Length>=3 alone can't catch them. Extend per domain.
      - "the"
      - "and"
      - "for"
      - "with"
      - "our"
      - "will"
      - "that"
      - "this"
      - "are"
      - "was"
      - "have"
      - "has"
      - "from"
      - "its"
      - "their"
      - "all"
      - "not"
      - "but"
      - "you"
      - "your"
      - "can"
      - "img"                     # leftover from "<!-- image: x.png -->" markers
      - "png"
      # Interrogatives + slide/layout furniture that surface as headings but
      # carry no retrieval value ("How", "What", a slide titled "Agenda").
      # Kept to high-confidence noise only — ambiguous words (rights / process /
      # part) are NOT listed, since they're often real content; the df>70%
      # filter handles those across a multi-file corpus.
      - "how"
      - "what"
      - "where"
      - "when"
      - "why"
      - "which"
      - "who"
      - "about"
      - "find"
      - "using"
      - "agenda"
      - "figure"
      - "table"
      - "image"
      - "content"
      # URL / domain fragments. Tokenizing "pwc.com" or "shaho.or.jp" splits
      # on the dots and leaks TLDs as standalone "keywords" (found in a real
      # audit: com / jp / llc pointing at a document that merely contains a
      # URL). The domain's meaningful part (pwc, shaho) is kept — only the
      # generic suffixes are noise.
      - "com"
      - "org"
      - "net"
      - "www"
      - "http"
      - "https"
      - "html"
      - "llc"
      - "inc"
      - "jp"                      # 2-char TLDs still surfaced in the audit —
      - "co"                      # some extraction paths skip latin_min_len
      # Japanese formal nouns (形式名詞) and quantifier furniture. SudachiPy's
      # POS filter keeps 名詞, which lets these grammatical nouns through —
      # they carry no retrieval value ("こと" = "thing/matter"). Same audit
      # source as the TLD group. High-confidence noise only, mirroring the
      # English list's policy on ambiguous words.
      - "こと"
      - "もの"
      - "ため"
      - "とき"
      - "ところ"
      - "これ"
      - "それ"
      - "ように"
      - "以上"
      - "以下"
    max_per_file: 15              # Max keywords per file in knowledge_map
    max_index: 50                 # Max entries in keyword_index reverse map
    # Discrimination filter (TF-IDF document-frequency cut-off): words that
    # appear in more than this fraction of files are treated as stop words
    # and dropped from keyword_index. Words in "too many files" have no
    # cross-file signal regardless of language or domain ("場合" / "事項" in
    # legal docs, "introduction" / "conclusion" in papers).
    # 1.0 disables the filter; the filter is also skipped for very small
    # corpora (< 3 files) where document frequency is not statistical.
    max_doc_frequency_ratio: 0.7
    # Body fallback for structure-less documents. Keywords are normally pulled
    # only from headings / title_paths / sheet names (high quality). A document
    # with NONE of those (a plain prose note, a scan, a single-section PDF —
    # any language) would contribute zero keywords and vanish from
    # keyword_index. When that happens, fall back to extracting from the first
    # few chunks' body text. Two guards keep body noise out: read at most
    # fallback_max_chunks, and drop extractions longer than fallback_max_kw_len
    # (a kana-less CJK run goes through the regex path, which can return a whole
    # clause as one "word"). Titled documents never hit this path. Set
    # fallback_to_body: false to restore the headings-only behaviour exactly.
    fallback_to_body: true
    fallback_max_chunks: 5        # chunks of body text scanned when falling back
    fallback_max_kw_len: 12       # drop fallback keywords longer than this (CJK clause guard)
# =============================================================================
# Sensitive Data Sanitization (PII masking)
# =============================================================================
sanitize:
  enabled: false                    # Default OFF — opt-in only (risk of false positives)
  # Rules can be overridden entirely via config. Each rule has:
  #   name: human-readable label
  #   pattern: regex pattern
  #   replacement: replacement string
  # Default rules (high precision only): email, URL, credit card (Luhn),
  # IPv4, Japanese phone numbers. No name detection (impossible with regex).
  # Set rules: [] to disable all defaults and use only your own.
  rules: null                       # null = use built-in defaults

  # Key = sha256(model_id + file_content_hash + relevant_config_hash)

# =============================================================================
# Hooks — pre/post-parse extension points
# =============================================================================
hooks:
  # Strip repeating per-page furniture (watermarks / logos / page numbers /
  # running dates) from the markdown before chunking — they otherwise pollute
  # every chunk. Vision transcribes the whole page image, so docling's own
  # content_layer furniture filter doesn't catch furniture that came via Vision.
  strip_repeating:
    enabled: false              # Default OFF — opt-in. Off = zero change.
    min_repeat_pages: 3         # A line repeating VERBATIM on >= N pages is
                                # DEDUPLICATED: first copy kept, later copies
                                # dropped. Never deletes every copy, so no
                                # unique content is ever lost (some body text —
                                # per-section notes, a short contract's header —
                                # also repeats verbatim). Raise to be stricter.
    max_line_chars: 120         # Only short lines are considered (furniture is
                                # short); long lines (body) are never touched.
    strip_page_numbers: false   # Opt-in. Drop standalone 1-3 digit lines (page
                                # numbers). OFF by default: a bare number is
                                # almost always a page number, but a body figure
                                # can land alone on a line, so it is not 100%
                                # safe. Turn on only if your docs have no such
                                # bare numeric body lines.

# =============================================================================
# GraphRAG (optional — requires `pip install -e ".[graph]"`)
# =============================================================================
# Builds an entity / relation knowledge graph + (optionally) community
# summaries on top of the chunks.jsonl that the main pipeline produces.
# This is a strictly OPT-IN downstream stage — main `docingest run` never
# touches it, the import path `docingest.graph` only loads when explicitly
# imported, and the produced files live in {output.dir}/{graph.output_subdir}/
# so deleting the directory leaves the rest of the knowledge base intact.
#
# Two retrieval modes (selected per build, baked into the index):
#   vector_only  — entity + relation embeddings only. Cheap. Single / two-hop
#                  questions and "find me content about X" style retrieval.
#                  Skips community detection + community summaries entirely.
#                  (Maps to LightRAG's "naive" + "local" query modes.)
#   full         — adds Leiden community detection + per-community LLM
#                  summaries. Enables global / hybrid / mix queries that
#                  answer "what are the main themes / trends" style
#                  questions. (Maps to LightRAG's full mode set.)
#
# Default OFF. Even when enabled, no work runs until the user invokes
# `docingest graph build` or `docingest.graph.build()` explicitly.
graph:
  # Declarative flag: the user (or automation) telling DocIngest "I do
  # want a graph layer on this knowledge base". It is NOT a gate that
  # prevents graph commands from running — what actually keeps the
  # graph layer dormant is:
  #   (1) [graph] extras not installed → docingest.graph module fails
  #       to import, CLI / MCP simply don't show the `graph` commands;
  #   (2) the main `docingest run` pipeline never touches the graph
  #       subpackage; nothing happens until the user explicitly invokes
  #       `docingest graph build` or `docingest.graph.build()`.
  # Set true if a downstream script keys off this value to decide
  # whether to trigger a build automatically.
  enabled: false                       # informational flag — default OFF
  backend: "lightrag"                  # lightrag (only backend in v1)
  mode: "full"                         # vector_only | full
  output_subdir: "graph"               # relative to output.dir

  # Which chunks feed the graph. Sourced exclusively from chunks.jsonl —
  # graph build NEVER re-parses original documents.
  input:
    chunks_file: "chunks.jsonl"        # relative to output.dir
    # Restrict to specific source formats. null = all formats.
    formats: null                      # e.g. ["pdf", "docx"]
    # Skip chunks shorter than this — page-headers / numbers / boilerplate
    # produce noise during entity extraction.
    min_chunk_tokens: 50

  # LLM for entity / relation extraction + community summaries.
  # primary / fallback INHERITED from models.defaults (one-model-to-rule) — the
  # graph layer is NOT a second source of "which model". Previously this pinned
  # gpt-5.4-mini as primary (the inverse of every other task's gemini-primary),
  # an inconsistency with no real benefit; it now follows the unified default.
  # To give graph extraction a different (e.g. cheaper) model, add a `primary:`
  # block here — an explicit per-task block always wins over the default.
  # The shape mirrors models.<task> (primary / fallback / max_response_tokens /
  # max_retries) so the same provider.py code paths apply.
  llm:
    max_response_tokens: 65536         # entity extraction returns structured JSON.
                                       # Raised to provider ceiling — 8K silently
                                       # truncated dense chunks with many entities,
                                       # causing partial graph extraction. Larger
                                       # chunks rarely need >8K but the headroom
                                       # is free until tokens are actually emitted.

  # Embedding model — independent from LLM (different provider OK).
  # Cannot be changed after first build without --force-rebuild: vector
  # dimensions are baked into the index files at creation time.
  embedding:
    provider: "openai"                 # openai | google | sentence_transformers
    model: "text-embedding-3-small"
    api_key_env: "OPENAI_API_KEY"
    dimension: 1536                    # MUST match the chosen model
    max_token_size: 8192               # max input tokens per embedding call
    max_batch_size: 32                 # batch size for ainsert

  # LightRAG-specific knobs. Other backends ignore unknown keys.
  lightrag:
    # LightRAG re-chunks internally — we feed DocIngest chunks as input,
    # but LightRAG may merge adjacent ones up to this size before doing
    # entity extraction. Default 1200 matches LightRAG's own default.
    chunk_token_size: 1200
    chunk_overlap_token_size: 100

    # Extra LLM passes per chunk to recover entities the first pass missed.
    # 0 = no extra pass (DocIngest default); 1 = LightRAG's own default;
    # 2+ rapidly hits diminishing returns at multiplied cost.
    #
    # Why we default to 0 (different from LightRAG's 1):
    #   The typical DocIngest input is a STRUCTURED document — DB design
    #   sheets, API specs, Q&A tables, contracts — where the first
    #   extraction pass already captures ~95%+ of meaningful entities.
    #   Gleaning doubles the LLM call count for a marginal recall bump
    #   that's mostly irrelevant on this shape of input.
    # When to raise back to 1 (or 2):
    #   - Free-flowing prose / academic papers / news articles.
    #   - Domain-specific jargon density that the first pass tends to
    #     miss (medical / legal corpus where edge entities matter).
    #   - You've observed empty / sparse entity counts in graph status
    #     and want a recall safety net.
    entity_extract_max_gleaning: 0

    # Chunks processed in parallel during build. LightRAG's own default
    # is 2 (conservative); 4 is a reasonable middle ground for most
    # OpenAI / Gemini accounts that have left tier-1 limits.
    # Higher values (6-8) need a high LLM tier or you'll hit rate
    # limits; lower values (1-2) protect a shared / low-quota account.
    # Has ZERO effect on extraction precision — pure throughput knob.
    max_parallel_insert: 4

    # LightRAG's own per-prompt LLM result cache (separate from DocIngest's
    # extraction cache below; both layers compose).
    enable_llm_cache: true
    # Output language passed to LightRAG's prompt templates. "auto" reads
    # the dominant language from the knowledge base's index.json language
    # tally; explicit values ("English" / "Chinese" / "Japanese" / ...)
    # bypass detection.
    language: "auto"
    # Community detection knobs (only consulted when graph.mode == "full").
    community:
      algorithm: "leiden"              # leiden (LightRAG's default)
      max_cluster_size: 10
      max_levels: 3                    # depth of community hierarchy

  # Incremental cache — reuses extraction results when chunk content
  # unchanged. Keyed by (chunk_id + content_hash + llm_config_hash). This
  # is independent of incremental.* (which guards the main pipeline) and
  # of LightRAG's own LLM cache (which dedups by exact prompt). All three
  # compose: a chunk that hasn't changed AND has a matching LLM config
  # skips extraction entirely; if extraction does run, identical prompts
  # hit LightRAG's prompt cache.
  cache:
    enabled: true
    cache_dir: ".graph_cache"          # relative to output.dir

  # Chunk enrichment — feed the graph's entity / description back into a
  # NEW jsonl file so traditional RAG (vector search on chunks) also gets
  # to use what GraphRAG extracted. The original chunks.jsonl is NEVER
  # modified — enrichment writes a parallel output_file the user can opt
  # to consume instead. Deleting that file leaves everything else intact.
  #
  # Why bother:
  # - Synonym recall: "修繕費" → matches a chunk where the entity is
  #   "原状回復費用" (their descriptions are now adjacent in the embedding
  #   space).
  # - Anchor signal: in a 1000-token chunk where 30 tokens are about
  #   "敷金", an explicit "[关键实体: 敷金 — 預かり金]" header gives the
  #   embedding model a clearer anchor.
  # - Metadata filtering: vector DBs can do `WHERE entities CONTAINS '敷金'`
  #   when the field is in metadata.
  enrich_chunks:
    enabled: false                     # master toggle — default OFF
    output_file: "chunks_enriched.jsonl"  # written next to chunks.jsonl

    # How many entities to inject per chunk. Picked from those whose graph
    # source_id includes that chunk, sorted by:
    #   1) chunks where the entity is exclusive (only this chunk) — most
    #      "definitional", highest signal
    #   2) shorter entity names (longer names are usually doc-headers /
    #      boilerplate carrying low information density)
    max_entities_per_chunk: 5

    # Per-entity description truncation, characters. The whole point is a
    # short anchor; full LLM-generated descriptions can be 200+ chars and
    # would balloon every chunk uselessly.
    max_description_length: 100

    # Two independent injection channels — disable either to keep the
    # other. Most users want both.
    inject_into_text: true             # adds "[关键实体: ...]" header line
                                       # → benefits pure vector RAG
    inject_into_metadata: true         # adds metadata.entities = [...]
                                       # → benefits metadata filtering / hybrid search

    # Templated so the injected line works in any language. {entities} is
    # the joined entity string; per-entity formatting uses
    # name_desc_separator.
    text_template: "[关键实体: {entities}]"
    entity_separator: "; "             # between consecutive entities
    name_desc_separator: " — "         # between entity name and its description


# ---------------------------------------------------------------------------
# Post-processing (optional, opt-in) — docingest.postprocess
# ---------------------------------------------------------------------------
# Second-pass LLM processing over a knowledge base's PRODUCED artefacts
# (sources/*.md or chunks.jsonl), never the original documents. The first
# (and currently only) processor is template-driven structured extraction:
# `docingest extract <kb> --template <name>` fills a YAML-declared schema
# from each document and writes <kb>/extracted/<template>.jsonl.
#
# Like `graph`, the main `docingest run` pipeline NEVER touches this — nothing
# happens until you invoke `docingest extract` or docingest.postprocess.run().
postprocess:
  input: "sources"                # what to process: sources (whole md files,
                                  # default — best for per-document records)
                                  # | chunks (chunks.jsonl lines, fine-grained)
  output_subdir: "extracted"      # results land in {output.dir}/extracted/
  parallel: 8                     # parallel LLM calls when ONE document is too
                                  # big for the context window and gets split
  piece_char_limit: 30000         # max chars per LLM call; a document longer
                                  # than this is split into multiple pieces,
                                  # processed in parallel, then merged. ~30K
                                  # chars stays well under the model window
                                  # (≈10K tokens CJK / 7.5K Latin).
  piece_overlap: 1500             # overlap (chars) between split pieces so a
                                  # fact straddling a boundary isn't lost
  min_chunk_tokens: 0             # (input=chunks only) skip chunks shorter
                                  # than this — 0 = keep all
  # LLM for extraction. INHERITED from models.defaults unless a
  # models.extraction block is added (same one-model-to-rule convention as
  # every other task). To use a cheaper model just for extraction, add a
  # models.extraction.primary block.
  extract:
    template_dir: "postprocess_templates"  # project-local template dir (CWD);
                                           # falls back to the package-bundled
                                           # postprocess_templates/ for built-ins
    max_list_items: 30            # cap list-type fields after cross-piece merge
                                  # so a many-piece document doesn't produce an
                                  # unbounded list (the POC's observed issue)
